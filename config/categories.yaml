    name: Mandatory
    description: Regular household expenses that generally must be paid.
    sort_order: 10

  - key: sinking
    name: Sinking
    description: Irregular or future expenses funded progressively.
    sort_order: 20

  - key: discretionary
    name: Discretionary
    description: Flexible spending that can be reduced or deferred.
    sort_order: 30

  - key: investments
    name: Investments
    description: Savings, investment, and balance-sheet transactions.
    sort_order: 40

