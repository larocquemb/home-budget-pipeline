# Merge this block into /etc/loki/config.yml on monitoring.idc.brownrook.net.
# Require a private-CA client certificate before exposing Loki to K3s.
server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  tls_min_version: VersionTLS12
  http_tls_config:
    cert_file: /etc/monitoring/tls/monitoring.fullchain.crt
    key_file: /etc/monitoring/tls/monitoring.key
    client_auth_type: RequireAndVerifyClientCert
    client_ca_file: /etc/monitoring/tls/brown-rook-client-ca.crt
