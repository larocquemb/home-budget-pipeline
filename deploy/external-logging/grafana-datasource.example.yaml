apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: https://monitoring.idc.brownrook.net:3100
    isDefault: true
    editable: false
    jsonData:
      tlsAuth: true
      tlsAuthWithCACert: true
      tlsSkipVerify: false
      serverName: monitoring.idc.brownrook.net
    secureJsonData:
      # Replace these placeholders only in the untracked host copy.
      tlsCACert: replace-with-brown-rook-root-ca-pem
      tlsClientCert: replace-with-grafana-client-certificate-pem
      tlsClientKey: replace-with-grafana-client-private-key-pem
