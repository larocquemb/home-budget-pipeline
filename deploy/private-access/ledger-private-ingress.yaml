apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-private
  namespace: home-budget
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ledger.brownrook.net
      secretName: k3ingress-tls
  rules:
    - host: ledger.brownrook.net
      http:
        paths:
          - path: /ledger
            pathType: Prefix
            backend:
              service:
                name: ledger-private-oauth2-proxy
                port:
                  number: 4180
