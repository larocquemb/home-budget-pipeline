apiVersion: v1
kind: Service
metadata:
  name: ledger-private-oauth2-proxy
  namespace: home-budget
spec:
  selector:
    app: ledger-private-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-private-oauth2-proxy
  namespace: home-budget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-private-oauth2-proxy
  template:
    metadata:
      labels:
        app: ledger-private-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4180
          envFrom:
            - secretRef:
                name: ledger-oauth2-proxy-secret
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://login.microsoftonline.com/$(ENTRA_TENANT_ID)/v2.0
            - --redirect-url=https://ledger.brownrook.net/ledger/oauth2/callback
            - --proxy-prefix=/ledger/oauth2
            - --upstream=http://ledger-web:8080
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --email-domain=*
            - --scope=openid profile email
            - --cookie-name=__Secure-ledger-internal
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-path=/ledger
            - --session-cookie-minimal=true
            - --set-xauthrequest=true
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
