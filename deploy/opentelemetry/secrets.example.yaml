# Shape only. Create these Secrets from externally protected PKI files; never
# commit real certificates, keys, tokens, or backend credentials.
apiVersion: v1
kind: Secret
metadata:
  name: receipt-telemetry-client-tls
  namespace: home-budget
type: kubernetes.io/tls
stringData:
  ca.crt: REPLACE_WITH_COLLECTOR_CA_CERTIFICATE
  tls.crt: REPLACE_WITH_RECEIPT_WORKER_CLIENT_CERTIFICATE
  tls.key: REPLACE_WITH_RECEIPT_WORKER_CLIENT_PRIVATE_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-collector-server-tls
  namespace: home-budget
type: kubernetes.io/tls
stringData:
  ca.crt: REPLACE_WITH_CLIENT_CA_CERTIFICATE
  tls.crt: REPLACE_WITH_COLLECTOR_SERVER_CERTIFICATE
  tls.key: REPLACE_WITH_COLLECTOR_SERVER_PRIVATE_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-collector-backend-tls
  namespace: home-budget
type: kubernetes.io/tls
stringData:
  ca.crt: REPLACE_WITH_BACKEND_CA_CERTIFICATE
  tls.crt: REPLACE_WITH_COLLECTOR_CLIENT_CERTIFICATE
  tls.key: REPLACE_WITH_COLLECTOR_CLIENT_PRIVATE_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-backend
  namespace: home-budget
type: Opaque
stringData:
  endpoint: monitoring.idc.brownrook.net:4317
  server-name: monitoring.idc.brownrook.net
