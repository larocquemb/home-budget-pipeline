apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: home-budget
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otel-collector-storage
  namespace: home-budget
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: home-budget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.160.0
          args: [--config=/etc/otelcol/collector.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: OTEL_BACKEND_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: otel-backend
                  key: endpoint
            - name: OTEL_BACKEND_SERVER_NAME
              valueFrom:
                secretKeyRef:
                  name: otel-backend
                  key: server-name
            - name: OTEL_TAIL_SAMPLING_PERCENTAGE
              value: "100"
            - name: OTEL_TAIL_SAMPLING_DECISION_WAIT
              value: 10s
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: health
              containerPort: 13133
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: server-tls
              mountPath: /var/run/otel/server
              readOnly: true
            - name: backend-tls
              mountPath: /var/run/otel/backend
              readOnly: true
            - name: storage
              mountPath: /var/lib/otelcol/storage
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: server-tls
          secret:
            secretName: otel-collector-server-tls
            defaultMode: 0440
        - name: backend-tls
          secret:
            secretName: otel-collector-backend-tls
            defaultMode: 0440
        - name: storage
          persistentVolumeClaim:
            claimName: otel-collector-storage
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
