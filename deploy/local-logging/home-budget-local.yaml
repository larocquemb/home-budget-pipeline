apiVersion: v1
kind: Service
metadata:
  name: home-budget-local
  namespace: home-budget
spec:
  selector:
    app: home-budget-local
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-budget-local
  namespace: home-budget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-budget-local
  template:
    metadata:
      labels:
        app: home-budget-local
    spec:
      containers:
        - name: ledger-web
          image: home-budget-pipeline:local
          imagePullPolicy: Never
          env:
            - name: LEDGER_BASE_PATH
              value: /ledger
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ledger/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /ledger/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
