apiVersion: v1
kind: Service
metadata:
  name: loki-local
  namespace: home-budget
spec:
  ports:
    - name: https
      port: 3100
      targetPort: 3100
---
# local_logging_up.sh replaces this documentation-only address with the Loki
# container's current address on the disposable Kind Docker network.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: loki-local
  namespace: home-budget
  labels:
    kubernetes.io/service-name: loki-local
addressType: IPv4
endpoints:
  - addresses:
      - 192.0.2.1
ports:
  - name: https
    protocol: TCP
    port: 3100
