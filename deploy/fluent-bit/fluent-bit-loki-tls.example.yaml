apiVersion: v1
kind: Secret
metadata:
  name: fluent-bit-loki-tls
  namespace: home-budget
type: kubernetes.io/tls
stringData:
  # Public CA certificate that issued the Loki server certificate.
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    replace-with-loki-server-ca
    -----END CERTIFICATE-----
  # Client certificate issued for the Fluent Bit identity.
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    replace-with-fluent-bit-client-certificate
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    replace-with-fluent-bit-client-private-key
    -----END PRIVATE KEY-----
