apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: home-budget
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fluent-bit
  namespace: home-budget
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fluent-bit
  namespace: home-budget
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: home-budget
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fluent-bit
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: home-budget
data:
  LOKI_HOST: monitoring.idc.brownrook.net
  LOKI_PORT: "3100"
  LOKI_TLS_VHOST: monitoring.idc.brownrook.net
  LOKI_CLUSTER: brownrook-k3s1
  LOKI_ENVIRONMENT: production
  FLUENT_BIT_LOG_LEVEL: info
  fluent-bit.conf: |
    [SERVICE]
        Flush                      1
        Grace                      30
        Log_Level                  ${FLUENT_BIT_LOG_LEVEL}
        Parsers_File               /fluent-bit/etc/parsers.conf
        Parsers_File               /fluent-bit/etc/parsers_multiline.conf
        HTTP_Server                On
        HTTP_Listen                0.0.0.0
        HTTP_Port                  2020
        Health_Check               On
        HC_Errors_Count            5
        HC_Retry_Failure_Count     5
        HC_Period                  60
        storage.path               /buffers
        storage.sync               normal
        storage.checksum           on
        storage.metrics            on
        storage.max_chunks_up      64
        storage.backlog.mem_limit  20M

    # Restrict collection at the node filesystem boundary. The agent's own
    # logs are excluded to prevent a forwarding loop.
    [INPUT]
        Name                       tail
        Alias                      home_budget_containers
        Tag                        kube.*
        Path                       /var/log/containers/*_home-budget_*.log
        Exclude_Path               /var/log/containers/*_home-budget_fluent-bit-*.log
        DB                         /buffers/tail.db
        DB.Sync                    Normal
        DB.Locking                 True
        DB.Compare_Filename        True
        Mem_Buf_Limit              10M
        Buffer_Max_Size            256K
        Skip_Long_Lines            On
        Rotate_Wait                30
        Read_From_Head             Off
        storage.type               filesystem
        multiline.parser           cri

    # CRI joins split container-runtime records. The Python parser then joins
    # application tracebacks before metadata enrichment and redaction.
    [FILTER]
        Name                       multiline
        Match                      kube.*
        multiline.key_content      log
        multiline.parser           python
        buffer                     On
        flush_ms                   2000
        emitter_mem_buf_limit      10M
        emitter_storage.type       filesystem

    [FILTER]
        Name                       kubernetes
        Match                      kube.*
        Kube_URL                   https://kubernetes.default.svc:443
        Kube_CA_File               /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File            /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix            kube.var.log.containers.
        Buffer_Size                0
        Kube_Meta_Cache_TTL        300s
        Merge_Log                  On
        Keep_Log                   On
        Labels                     On
        Annotations                Off
        K8S-Logging.Parser         Off
        K8S-Logging.Exclude        Off

    # Emit a deliberately bounded record. Receipt names, hashes, request IDs,
    # run UUIDs, and pass IDs remain only in the message body.
    [FILTER]
        Name                       lua
        Match                      kube.*
        Script                     /fluent-bit/etc/filters.lua
        Call                       redact_and_enrich
        Protected_Mode             On

    [OUTPUT]
        Name                       loki
        Alias                      monitoring_loki
        Match                      kube.*
        Host                       ${LOKI_HOST}
        Port                       ${LOKI_PORT}
        URI                        /loki/api/v1/push
        Labels                     cluster=${LOKI_CLUSTER},environment=${LOKI_ENVIRONMENT},collection=fluent-bit,namespace=$namespace,pod=$pod,container=$container,node=$node,app=$app,service=$service,job=$job
        Auto_Kubernetes_Labels     Off
        Remove_Keys                namespace,pod,container,node,app,service,job,stream
        Drop_Single_Key            raw
        Line_Format                json
        Compress                   gzip
        TLS                        On
        TLS.Verify                 On
        TLS.Verify_Hostname        On
        TLS.CA_File                /fluent-bit/tls/ca.crt
        TLS.Crt_File               /fluent-bit/tls/tls.crt
        TLS.Key_File               /fluent-bit/tls/tls.key
        TLS.Vhost                  ${LOKI_TLS_VHOST}
        Retry_Limit                False
        storage.total_limit_size   256M
        workers                    2
  filters.lua: |
    local function redact(value)
      if type(value) ~= "string" then return "" end
      value = value:gsub("\27%[[0-9;]*[A-Za-z]", "")
      value = value:gsub("[Pp][Oo][Ss][Tt][Gg][Rr][Ee][Ss][Qq]?[Ll]?://[^%s\"']+", "postgresql://[REDACTED]")
      value = value:gsub("([Aa][Pp][Ii][_-]?[Kk][Ee][Yy]%s*[=:]%s*)[^%s,;]+", "%1[REDACTED]")
      value = value:gsub("([Tt][Oo][Kk][Ee][Nn]%s*[=:]%s*)[^%s,;]+", "%1[REDACTED]")
      value = value:gsub("([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]%s*[=:]%s*)[^%s,;]+", "%1[REDACTED]")
      value = value:gsub("([Bb][Ee][Aa][Rr][Ee][Rr]%s+)[^%s,;]+", "%1[REDACTED]")
      return value
    end

    local function bounded_label(value, fallback)
      if type(value) ~= "string" or value == "" then return fallback end
      return value
    end

    function redact_and_enrich(tag, timestamp, record)
      local kube = record["kubernetes"] or {}
      local labels = kube["labels"] or {}
      local namespace = bounded_label(kube["namespace_name"], "home-budget")
      local pod = bounded_label(kube["pod_name"], "unknown")
      local container = bounded_label(kube["container_name"], "unknown")
      local node = bounded_label(kube["host"], os.getenv("NODE_NAME") or "unknown")
      local app = bounded_label(labels["app"], labels["app.kubernetes.io/name"] or container)
      local service = bounded_label(labels["app.kubernetes.io/name"], app)

      local output = {
        message = redact(record["log"] or record["message"] or ""),
        namespace = namespace,
        pod = pod,
        container = container,
        node = node,
        app = app,
        service = service,
        job = namespace .. "/" .. container,
        stream = bounded_label(record["stream"], "stdout"),
      }
      return 1, timestamp, output
    end
---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit
  namespace: home-budget
  labels:
    app: fluent-bit
spec:
  selector:
    app: fluent-bit
  ports:
    - name: metrics
      port: 2020
      targetPort: metrics
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: home-budget
spec:
  selector:
    matchLabels:
      app: fluent-bit
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: fluent-bit
      annotations:
        fluentbit.io/exclude: "true"
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/v2/metrics/prometheus
        prometheus.io/port: "2020"
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:4.2.0
          args: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
          ports:
            - name: metrics
              containerPort: 2020
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOKI_HOST
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-config
                  key: LOKI_HOST
            - name: LOKI_PORT
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-config
                  key: LOKI_PORT
            - name: LOKI_TLS_VHOST
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-config
                  key: LOKI_TLS_VHOST
            - name: LOKI_CLUSTER
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-config
                  key: LOKI_CLUSTER
            - name: LOKI_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-config
                  key: LOKI_ENVIRONMENT
            - name: FLUENT_BIT_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-config
                  key: FLUENT_BIT_LOG_LEVEL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v2/health
              port: metrics
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/filters.lua
              subPath: filters.lua
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: buffers
              mountPath: /buffers
            - name: loki-tls
              mountPath: /fluent-bit/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: buffers
          hostPath:
            path: /var/lib/home-budget/fluent-bit
            type: DirectoryOrCreate
        - name: loki-tls
          secret:
            secretName: fluent-bit-loki-tls
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
