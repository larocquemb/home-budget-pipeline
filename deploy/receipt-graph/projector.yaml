apiVersion: batch/v1
kind: CronJob
metadata:
  name: receipt-graph
  namespace: home-budget
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 540
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: receipt-graph
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: graph
              image: ghcr.io/larocquemb/home-budget-pipeline
              command: [home-budget-receipt-graph]
              args: [--all]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: DATABASE_URL
              envFrom:
                - secretRef:
                    name: neo4j-secret
