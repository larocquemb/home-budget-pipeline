apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-management-private
  namespace: home-budget
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rabbitmq.brownrook.net
      secretName: rabbitmq-brownrook-net-tls
  rules:
    - host: rabbitmq.brownrook.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
