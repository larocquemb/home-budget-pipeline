apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-worker
  namespace: home-budget
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    workload: receipt-worker
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Release the old worker's CPU reservation before scheduling its replacement.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: receipt-worker
  template:
    metadata:
      labels:
        app: receipt-worker
        workload: receipt-worker
    spec:
      terminationGracePeriodSeconds: 900
      nodeSelector:
        kubernetes.io/hostname: arsene
      # Keep OCR memory pressure away from the control plane, database and broker.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: receipt-worker
          image: ghcr.io/larocquemb/home-budget-pipeline
          imagePullPolicy: IfNotPresent
          command: [ledger]
          args: [receipts, consume]
          env:
            - name: RECEIPT_SOURCE_ROOT
              value: /data/receipts/raw/scanned
            - name: ELECTRONIC_RECEIPT_SOURCE_ROOT
              value: /data/receipts/raw/electronic
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_URL
            - name: HOME_BUDGET_OCR_CACHE
              valueFrom:
                configMapKeyRef:
                  name: receipt-runtime-config
                  key: HOME_BUDGET_OCR_CACHE
            - name: HOME_BUDGET_PADDLE_OCR
              value: "true"
            - name: OCR_ARTIFACT_URI_PREFIX
              value: pvc://home-budget/receipts/derived/ocr-cache
          envFrom:
            - configMapRef:
                name: ocr-artifact-storage
                optional: true
            - secretRef:
                name: ocr-artifact-storage
                optional: true
          resources:
            requests:
              cpu: "1"
              # Reserve the full memory limit so two workers cannot fit Longbow.
              memory: 8Gi
            limits:
              cpu: "6"
              memory: 8Gi
          volumeMounts:
            - name: receipt-data
              mountPath: /data
      volumes:
        - name: receipt-data
          persistentVolumeClaim:
            claimName: home-budget-data
