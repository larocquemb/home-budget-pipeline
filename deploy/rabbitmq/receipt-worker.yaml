apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-worker
  namespace: home-budget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receipt-worker
  template:
    metadata:
      labels:
        app: receipt-worker
    spec:
      terminationGracePeriodSeconds: 900
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: receipt-worker
          image: ghcr.io/larocquemb/home-budget-pipeline
          imagePullPolicy: IfNotPresent
          command: [ledger]
          args: [receipts, consume, /data/receipts/raw/scanned/inbox]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_URL
            - name: HOME_BUDGET_OCR_CACHE
              value: /data/receipts/derived/ocr-cache
            - name: HOME_BUDGET_PADDLE_OCR
              value: "true"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: receipt-data
              mountPath: /data
      volumes:
        - name: receipt-data
          persistentVolumeClaim:
            claimName: home-budget-data
