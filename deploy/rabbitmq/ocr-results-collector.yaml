apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-results-collector
  namespace: home-budget
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ocr-results-collector
  template:
    metadata:
      labels:
        app: ocr-results-collector
    spec:
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ocr-results-collector
          image: ghcr.io/larocquemb/home-budget-pipeline
          imagePullPolicy: IfNotPresent
          command: [ledger]
          args: [receipts, collect]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
