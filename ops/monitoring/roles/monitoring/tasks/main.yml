---
- name: Validate controller inputs
  ansible.builtin.assert:
    that:
      - monitoring_loki_stage in ['optional', 'enforced']
      - monitoring_pki_dir | length > 0
      - monitoring_alloy_kubeconfig | length > 0
      - monitoring_admin_kubeconfig | length > 0
      - monitoring_grafana_admin_password | length > 0
    fail_msg: >-
      Set MONITORING_PKI_DIR, MONITORING_ALLOY_KUBECONFIG,
      MONITORING_ADMIN_KUBECONFIG, and MONITORING_GRAFANA_ADMIN_PASSWORD; the
      wrapper prompts for the password.
    quiet: true
  become: false
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Define external input files
  ansible.builtin.set_fact:
    monitoring_external_inputs:
      - {label: root CA, path: "{{ monitoring_root_ca_source }}", private: false}
      - {label: intermediate CA, path: "{{ monitoring_intermediate_ca_source }}", private: false}
      - {label: monitoring certificate, path: "{{ monitoring_server_cert_source }}", private: false}
      - {label: monitoring key, path: "{{ monitoring_server_key_source }}", private: true}
      - {label: Alloy certificate, path: "{{ monitoring_alloy_cert_source }}", private: false}
      - {label: Alloy key, path: "{{ monitoring_alloy_key_source }}", private: true}
      - {label: Grafana certificate, path: "{{ monitoring_grafana_cert_source }}", private: false}
      - {label: Grafana key, path: "{{ monitoring_grafana_key_source }}", private: true}
      - {label: Fluent Bit certificate, path: "{{ monitoring_fluent_bit_cert_source }}", private: false}
      - {label: Fluent Bit key, path: "{{ monitoring_fluent_bit_key_source }}", private: true}
      - {label: OTLP backend server certificate, path: "{{ monitoring_otel_backend_server_cert_source }}", private: false}
      - {label: OTLP backend server key, path: "{{ monitoring_otel_backend_server_key_source }}", private: true}
      - {label: receipt telemetry certificate, path: "{{ monitoring_receipt_telemetry_cert_source }}", private: false}
      - {label: receipt telemetry key, path: "{{ monitoring_receipt_telemetry_key_source }}", private: true}
      - {label: Collector server certificate, path: "{{ monitoring_otel_collector_server_cert_source }}", private: false}
      - {label: Collector server key, path: "{{ monitoring_otel_collector_server_key_source }}", private: true}
      - {label: Collector backend certificate, path: "{{ monitoring_otel_collector_backend_cert_source }}", private: false}
      - {label: Collector backend key, path: "{{ monitoring_otel_collector_backend_key_source }}", private: true}
      - {label: Alloy reader kubeconfig, path: "{{ monitoring_alloy_kubeconfig }}", private: true}
      - {label: Kubernetes admin kubeconfig, path: "{{ monitoring_admin_kubeconfig }}", private: true}
  become: false
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Inspect external input files
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ monitoring_external_inputs }}"
  loop_control:
    label: "{{ item.label }}"
  become: false
  delegate_to: localhost
  run_once: true
  register: monitoring_external_input_stats
  no_log: true

- name: Require present, regular, protected external inputs
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.item.private or item.stat.mode in ['0400', '0600']
    fail_msg: >-
      {{ item.item.label }} is missing, is not a regular file, or its private
      permissions are not 0400/0600.
    quiet: true
  loop: "{{ monitoring_external_input_stats.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  become: false
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Validate external certificate identities
  ansible.builtin.include_tasks: validate_identity.yml
  loop:
    - name: monitoring server
      cert: "{{ monitoring_server_cert_source }}"
      key: "{{ monitoring_server_key_source }}"
      purpose: sslserver
      hostname: "{{ monitoring_loki_hostname }}"
    - name: Alloy client
      cert: "{{ monitoring_alloy_cert_source }}"
      key: "{{ monitoring_alloy_key_source }}"
      purpose: sslclient
    - name: Grafana client
      cert: "{{ monitoring_grafana_cert_source }}"
      key: "{{ monitoring_grafana_key_source }}"
      purpose: sslclient
    - name: Fluent Bit client
      cert: "{{ monitoring_fluent_bit_cert_source }}"
      key: "{{ monitoring_fluent_bit_key_source }}"
      purpose: sslclient
    - name: OTLP backend server
      cert: "{{ monitoring_otel_backend_server_cert_source }}"
      key: "{{ monitoring_otel_backend_server_key_source }}"
      purpose: sslserver
      hostname: "{{ monitoring_otel_hostname }}"
    - name: receipt telemetry client
      cert: "{{ monitoring_receipt_telemetry_cert_source }}"
      key: "{{ monitoring_receipt_telemetry_key_source }}"
      purpose: sslclient
    - name: Collector server
      cert: "{{ monitoring_otel_collector_server_cert_source }}"
      key: "{{ monitoring_otel_collector_server_key_source }}"
      purpose: sslserver
      hostname: otel-collector.home-budget.svc.cluster.local
    - name: Collector backend client
      cert: "{{ monitoring_otel_collector_backend_cert_source }}"
      key: "{{ monitoring_otel_collector_backend_key_source }}"
      purpose: sslclient
  loop_control:
    loop_var: monitoring_identity

- name: Verify Alloy reader permission boundary
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ monitoring_alloy_kubeconfig }}"
      - --namespace
      - "{{ monitoring_kubernetes_namespace }}"
      - auth
      - can-i
      - "{{ item.verb }}"
      - "{{ item.resource }}"
  loop:
    - {verb: list, resource: pods, expected: "yes"}
    - {verb: get, resource: pods/log, expected: "yes"}
    - {verb: get, resource: secrets, expected: "no"}
  loop_control:
    label: "{{ item.verb }} {{ item.resource }} = {{ item.expected }}"
  become: false
  delegate_to: localhost
  run_once: true
  check_mode: false
  changed_when: false
  register: monitoring_alloy_permission_checks
  failed_when: monitoring_alloy_permission_checks.rc not in [0, 1]
  no_log: true
  tags: [monitoring_permissions]

- name: Confirm Alloy reader remains least privilege
  ansible.builtin.assert:
    that:
      - item.stdout | trim == item.item.expected
    fail_msg: >-
      Alloy reader permission mismatch for {{ item.item.verb }}
      {{ item.item.resource }}; expected {{ item.item.expected }}.
    quiet: true
  loop: "{{ monitoring_alloy_permission_checks.results }}"
  loop_control:
    label: "{{ item.item.verb }} {{ item.item.resource }}"
  become: false
  delegate_to: localhost
  run_once: true
  tags: [monitoring_permissions]

- name: Verify controller permission to reconcile the TLS Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ monitoring_admin_kubeconfig }}"
      - --context
      - "{{ monitoring_kubernetes_admin_context }}"
      - --namespace
      - "{{ monitoring_kubernetes_namespace }}"
      - auth
      - can-i
      - "{{ item }}"
      - secrets
  loop:
    - get
    - create
    - patch
  become: false
  delegate_to: localhost
  run_once: true
  check_mode: false
  changed_when: false
  register: monitoring_admin_permission_checks
  no_log: true
  tags: [monitoring_permissions]

- name: Confirm controller can reconcile the TLS Secret
  ansible.builtin.assert:
    that:
      - item.stdout | trim == 'yes'
    fail_msg: >-
      The {{ monitoring_kubernetes_admin_context }} controller credential
      cannot {{ item.item }} Secrets in {{ monitoring_kubernetes_namespace }}.
    quiet: true
  loop: "{{ monitoring_admin_permission_checks.results }}"
  loop_control:
    label: "{{ item.item }} secrets"
  become: false
  delegate_to: localhost
  run_once: true
  tags: [monitoring_permissions]

- name: Read root CA for the Kubernetes Secret
  ansible.builtin.slurp:
    src: "{{ monitoring_root_ca_source }}"
  become: false
  delegate_to: localhost
  run_once: true
  register: monitoring_root_ca_data
  no_log: true

- name: Read Fluent Bit certificate for the Kubernetes Secret
  ansible.builtin.slurp:
    src: "{{ monitoring_fluent_bit_cert_source }}"
  become: false
  delegate_to: localhost
  run_once: true
  register: monitoring_fluent_bit_cert_data
  no_log: true

- name: Read Fluent Bit key for the Kubernetes Secret
  ansible.builtin.slurp:
    src: "{{ monitoring_fluent_bit_key_source }}"
  become: false
  delegate_to: localhost
  run_once: true
  register: monitoring_fluent_bit_key_data
  no_log: true

- name: Build the in-memory Fluent Bit Secret
  ansible.builtin.set_fact:
    monitoring_fluent_bit_secret:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ monitoring_fluent_bit_secret_name }}"
        namespace: "{{ monitoring_kubernetes_namespace }}"
      type: kubernetes.io/tls
      data:
        ca.crt: "{{ monitoring_root_ca_data.content }}"
        tls.crt: "{{ monitoring_fluent_bit_cert_data.content }}"
        tls.key: "{{ monitoring_fluent_bit_key_data.content }}"
  become: false
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Check the Fluent Bit Secret for drift
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ monitoring_kubernetes_admin_context }}"
      - --namespace
      - "{{ monitoring_kubernetes_namespace }}"
      - diff
      - --filename=-
    stdin: "{{ monitoring_fluent_bit_secret | to_json }}"
  environment:
    KUBECONFIG: "{{ monitoring_admin_kubeconfig }}"
  become: false
  delegate_to: localhost
  run_once: true
  check_mode: false
  register: monitoring_secret_diff
  failed_when: monitoring_secret_diff.rc not in [0, 1]
  changed_when: monitoring_secret_diff.rc == 1
  when: ansible_check_mode
  no_log: true

- name: Reconcile the Fluent Bit Secret
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ monitoring_kubernetes_admin_context }}"
      - --namespace
      - "{{ monitoring_kubernetes_namespace }}"
      - apply
      - --filename=-
    stdin: "{{ monitoring_fluent_bit_secret | to_json }}"
  environment:
    KUBECONFIG: "{{ monitoring_admin_kubeconfig }}"
  become: false
  delegate_to: localhost
  run_once: true
  check_mode: false
  register: monitoring_secret_apply
  changed_when: "'unchanged' not in monitoring_secret_apply.stdout"
  when: not ansible_check_mode
  no_log: true

- name: Read telemetry certificates and keys for Kubernetes Secrets
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop:
    - {label: receipt telemetry certificate, path: "{{ monitoring_receipt_telemetry_cert_source }}"}
    - {label: receipt telemetry key, path: "{{ monitoring_receipt_telemetry_key_source }}"}
    - {label: Collector server certificate, path: "{{ monitoring_otel_collector_server_cert_source }}"}
    - {label: Collector server key, path: "{{ monitoring_otel_collector_server_key_source }}"}
    - {label: Collector backend certificate, path: "{{ monitoring_otel_collector_backend_cert_source }}"}
    - {label: Collector backend key, path: "{{ monitoring_otel_collector_backend_key_source }}"}
  loop_control:
    label: "{{ item.label }}"
  become: false
  delegate_to: localhost
  run_once: true
  register: monitoring_telemetry_pki_data
  no_log: true

- name: Build in-memory telemetry Secrets
  ansible.builtin.set_fact:
    monitoring_telemetry_secrets:
      - label: receipt telemetry client
        manifest:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ monitoring_receipt_telemetry_secret_name }}"
            namespace: "{{ monitoring_kubernetes_namespace }}"
          type: kubernetes.io/tls
          data:
            ca.crt: "{{ monitoring_root_ca_data.content }}"
            tls.crt: "{{ monitoring_telemetry_pki_data.results[0].content }}"
            tls.key: "{{ monitoring_telemetry_pki_data.results[1].content }}"
      - label: Collector server
        manifest:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ monitoring_otel_collector_server_secret_name }}"
            namespace: "{{ monitoring_kubernetes_namespace }}"
          type: kubernetes.io/tls
          data:
            ca.crt: "{{ monitoring_root_ca_data.content }}"
            tls.crt: "{{ monitoring_telemetry_pki_data.results[2].content }}"
            tls.key: "{{ monitoring_telemetry_pki_data.results[3].content }}"
      - label: Collector backend client
        manifest:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ monitoring_otel_collector_backend_secret_name }}"
            namespace: "{{ monitoring_kubernetes_namespace }}"
          type: kubernetes.io/tls
          data:
            ca.crt: "{{ monitoring_root_ca_data.content }}"
            tls.crt: "{{ monitoring_telemetry_pki_data.results[4].content }}"
            tls.key: "{{ monitoring_telemetry_pki_data.results[5].content }}"
      - label: OTLP backend endpoint
        manifest:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ monitoring_otel_backend_secret_name }}"
            namespace: "{{ monitoring_kubernetes_namespace }}"
          type: Opaque
          data:
            endpoint: >-
              {{ (monitoring_otel_hostname ~ ':' ~ monitoring_otel_port) | b64encode }}
            server-name: "{{ monitoring_otel_hostname | b64encode }}"
  become: false
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Check telemetry Secrets for drift
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ monitoring_kubernetes_admin_context }}"
      - --namespace
      - "{{ monitoring_kubernetes_namespace }}"
      - diff
      - --filename=-
    stdin: "{{ item.manifest | to_json }}"
  environment:
    KUBECONFIG: "{{ monitoring_admin_kubeconfig }}"
  loop: "{{ monitoring_telemetry_secrets }}"
  loop_control:
    label: "{{ item.label }}"
  become: false
  delegate_to: localhost
  run_once: true
  check_mode: false
  register: monitoring_telemetry_secret_diff
  failed_when: monitoring_telemetry_secret_diff.rc not in [0, 1]
  changed_when: monitoring_telemetry_secret_diff.rc == 1
  when: ansible_check_mode
  no_log: true

- name: Reconcile telemetry Secrets
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ monitoring_kubernetes_admin_context }}"
      - --namespace
      - "{{ monitoring_kubernetes_namespace }}"
      - apply
      - --filename=-
    stdin: "{{ item.manifest | to_json }}"
  environment:
    KUBECONFIG: "{{ monitoring_admin_kubeconfig }}"
  loop: "{{ monitoring_telemetry_secrets }}"
  loop_control:
    label: "{{ item.label }}"
  become: false
  delegate_to: localhost
  run_once: true
  check_mode: false
  register: monitoring_telemetry_secret_apply
  changed_when: "'unchanged' not in monitoring_telemetry_secret_apply.stdout"
  when: not ansible_check_mode
  no_log: true

- name: Install pinned Tempo package
  ansible.builtin.apt:
    name: "tempo={{ monitoring_tempo_version }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Inspect Tempo command after package reconciliation
  ansible.builtin.stat:
    path: /usr/bin/tempo
  register: monitoring_tempo_command

- name: Inspect required monitoring-host commands
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/alloy
    - /usr/bin/loki
    - /usr/bin/prometheus
    - /usr/sbin/nft
    - /usr/sbin/update-ca-certificates
  register: monitoring_command_stats

- name: Require installed host services
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.executable
    fail_msg: "Required command is not installed: {{ item.item }}"
    quiet: true
  loop: "{{ monitoring_command_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Require installed Tempo service after package reconciliation
  ansible.builtin.assert:
    that:
      - monitoring_tempo_command.stat.exists
      - monitoring_tempo_command.stat.executable
    fail_msg: "Required command is not installed: /usr/bin/tempo"
    quiet: true
  when: not ansible_check_mode or monitoring_tempo_command.stat.exists

- name: Create shared monitoring TLS group
  ansible.builtin.group:
    name: monitoring-tls
    system: true
    state: present

- name: Grant services access to the monitoring server key
  ansible.builtin.user:
    name: "{{ item }}"
    groups: monitoring-tls
    append: true
  loop:
    - loki
    - grafana

- name: Create monitoring TLS directory
  ansible.builtin.file:
    path: "{{ monitoring_tls_dir }}"
    state: directory
    owner: root
    group: monitoring-tls
    mode: "0750"

- name: Install monitoring server certificate
  ansible.builtin.copy:
    src: "{{ monitoring_server_cert_source }}"
    dest: "{{ monitoring_tls_dir }}/monitoring.fullchain.crt"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart Loki

- name: Install monitoring server key
  ansible.builtin.copy:
    src: "{{ monitoring_server_key_source }}"
    dest: "{{ monitoring_tls_dir }}/monitoring.key"
    owner: root
    group: monitoring-tls
    mode: "0640"
    backup: true
  notify: restart Loki
  no_log: true

- name: Install Loki client CA
  ansible.builtin.copy:
    src: "{{ monitoring_root_ca_source }}"
    dest: "{{ monitoring_tls_dir }}/brown-rook-client-ca.crt"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart Loki

- name: Install Brown Rook CA in operating-system trust
  ansible.builtin.copy:
    src: "{{ monitoring_root_ca_source }}"
    dest: /usr/local/share/ca-certificates/brown-rook-root-ca.crt
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: update operating-system CA trust

- name: Create Alloy configuration directory
  ansible.builtin.file:
    path: "{{ monitoring_alloy_dir }}"
    state: directory
    owner: root
    group: alloy
    mode: "0750"

- name: Install Alloy Kubernetes credential
  ansible.builtin.copy:
    src: "{{ monitoring_alloy_kubeconfig }}"
    dest: "{{ monitoring_alloy_dir }}/home-budget.kubeconfig"
    owner: root
    group: alloy
    mode: "0640"
    backup: true
  notify: restart Alloy
  no_log: true

- name: Install Alloy root CA
  ansible.builtin.copy:
    src: "{{ monitoring_root_ca_source }}"
    dest: "{{ monitoring_alloy_dir }}/brown-rook-root-ca.crt"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart Alloy

- name: Install Alloy OTLP server certificate
  ansible.builtin.copy:
    src: "{{ monitoring_otel_backend_server_cert_source }}"
    dest: "{{ monitoring_alloy_dir }}/otel-server.crt"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart Alloy

- name: Install Alloy OTLP server key
  ansible.builtin.copy:
    src: "{{ monitoring_otel_backend_server_key_source }}"
    dest: "{{ monitoring_alloy_dir }}/otel-server.key"
    owner: root
    group: alloy
    mode: "0640"
    backup: true
  notify: restart Alloy
  no_log: true

- name: Install Alloy client certificate
  ansible.builtin.copy:
    src: "{{ monitoring_alloy_cert_source }}"
    dest: "{{ monitoring_alloy_dir }}/loki-client.crt"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart Alloy

- name: Install Alloy client key
  ansible.builtin.copy:
    src: "{{ monitoring_alloy_key_source }}"
    dest: "{{ monitoring_alloy_dir }}/loki-client.key"
    owner: root
    group: alloy
    mode: "0640"
    backup: true
  notify: restart Alloy
  no_log: true

- name: Install validated Alloy configuration
  ansible.builtin.copy:
    src: "{{ monitoring_repo_root }}/deploy/external-logging/config.alloy"
    dest: "{{ monitoring_alloy_dir }}/config.alloy"
    owner: root
    group: alloy
    mode: "0640"
    backup: true
    validate: /usr/bin/alloy validate %s
  notify: restart Alloy

- name: Enable Prometheus remote-write ingestion on loopback
  ansible.builtin.lineinfile:
    path: "{{ monitoring_prometheus_defaults_path }}"
    regexp: '^ARGS='
    line: 'ARGS="{{ monitoring_prometheus_args }}"'
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart Prometheus

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: "{{ monitoring_prometheus_rules_dir }}"
    state: directory
    owner: root
    group: prometheus
    mode: "0750"

- name: Install validated home-budget Prometheus rules
  ansible.builtin.copy:
    src: prometheus-home-budget-rules.yml
    dest: "{{ monitoring_prometheus_rules_path }}"
    owner: root
    group: prometheus
    mode: "0640"
    backup: true
    validate: /usr/bin/promtool check rules %s
  notify: restart Prometheus

- name: Load Git-managed Prometheus rules
  ansible.builtin.lineinfile:
    path: "{{ monitoring_prometheus_config_path }}"
    regexp: '^rule_files:'
    line: 'rule_files: ["{{ monitoring_prometheus_rules_dir }}/*.yml"]'
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/bin/promtool check config %s
  notify: restart Prometheus

- name: Independently scrape Alloy metrics from Prometheus
  ansible.builtin.blockinfile:
    path: "{{ monitoring_prometheus_config_path }}"
    insertafter: '^scrape_configs:$'
    marker: '  # {mark} ANSIBLE MANAGED BLOCK: home-budget Alloy scrape'
    block: |2
        - job_name: alloy
          static_configs:
            - targets:
                - "{{ monitoring_alloy_metrics_target }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/bin/promtool check config %s
  notify: restart Prometheus

- name: Create Grafana systemd override directory
  ansible.builtin.file:
    path: "{{ monitoring_grafana_systemd_override_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Enforce the Grafana public-dashboard security boundary
  ansible.builtin.copy:
    content: |
      [Service]
      Environment="GF_SERVER_HTTP_ADDR=0.0.0.0"
      Environment="GF_AUTH_ANONYMOUS_ENABLED=false"
      Environment="GF_PUBLIC_DASHBOARDS_ENABLED=true"
    dest: "{{ monitoring_grafana_systemd_override_dir }}/home-budget-public-demo.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart Grafana

- name: Provision Grafana Prometheus datasource
  ansible.builtin.template:
    src: grafana-prometheus-datasource.yml.j2
    dest: "{{ monitoring_grafana_prometheus_provisioning_path }}"
    owner: root
    group: grafana
    mode: "0640"
    backup: true
  notify: restart Grafana

- name: Keep Grafana's Loki hostname on loopback
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^[^#]*[[:space:]]{{ monitoring_loki_hostname | regex_escape }}([[:space:]]|$)"
    line: "127.0.0.1 {{ monitoring_loki_hostname }}"
    owner: root
    group: root
    mode: "0644"

- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install monitoring journal limits
  ansible.builtin.template:
    src: journald-monitoring.conf.j2
    dest: /etc/systemd/journald.conf.d/monitoring-limits.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: restart journald

- name: Enable nftables before changing its policy
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Install validated nftables policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/sbin/nft --check --file %s
  notify: restart nftables

- name: Create durable Loki storage
  ansible.builtin.file:
    path: "{{ monitoring_loki_storage_path }}"
    state: directory
    owner: loki
    group: root
    mode: "0750"

- name: Create Tempo storage and work directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: tempo
    group: root
    mode: "0750"
  loop:
    - "{{ monitoring_tempo_storage_path }}"
    - "{{ monitoring_tempo_work_path }}"
  when: monitoring_tempo_command.stat.exists

- name: Install validated Tempo configuration
  ansible.builtin.template:
    src: tempo-config.yml.j2
    dest: "{{ monitoring_tempo_config_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: /usr/bin/tempo --config.file=%s --config.verify=true
  notify: restart Tempo
  when: monitoring_tempo_command.stat.exists

- name: Install validated Loki configuration
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: "{{ monitoring_loki_config_path }}"
    owner: root
    group: monitoring-tls
    mode: "0640"
    backup: true
    validate: /usr/bin/loki -config.file=%s -verify-config
  notify: restart Loki

- name: Enable Loki and Alloy
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - loki
    - alloy

- name: Enable Tempo
  ansible.builtin.systemd_service:
    name: tempo
    enabled: true
    state: started
  when: monitoring_tempo_command.stat.exists

- name: Activate validated host changes
  ansible.builtin.meta: flush_handlers

- name: Probe Alloy OTLP listener before readiness checks
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ monitoring_otel_port }}"
    state: started
    timeout: 1
  register: monitoring_alloy_otlp_probe
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Restart Alloy when its installed OTLP configuration is not active
  ansible.builtin.systemd_service:
    name: alloy
    state: restarted
  when:
    - not ansible_check_mode
    - monitoring_alloy_otlp_probe.state | default('') != 'started'

- name: Wait for authenticated Loki readiness
  ansible.builtin.uri:
    url: "https://{{ monitoring_loki_hostname }}:{{ monitoring_loki_port }}/ready"
    ca_path: "{{ monitoring_alloy_dir }}/brown-rook-root-ca.crt"
    client_cert: "{{ monitoring_alloy_dir }}/loki-client.crt"
    client_key: "{{ monitoring_alloy_dir }}/loki-client.key"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_loki_ready
  retries: 12
  delay: 5
  until: monitoring_loki_ready.status == 200
  check_mode: false
  when: not ansible_check_mode

- name: Wait for Tempo readiness on loopback
  ansible.builtin.uri:
    url: >-
      http://{{ monitoring_tempo_http_address }}:{{ monitoring_tempo_http_port }}/ready
    return_content: true
    status_code: 200
  register: monitoring_tempo_ready
  retries: 30
  delay: 5
  until: monitoring_tempo_ready.status == 200
  check_mode: false
  when: not ansible_check_mode

- name: Wait for Prometheus readiness on loopback
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/ready
    return_content: true
    status_code: 200
  register: monitoring_prometheus_ready
  retries: 12
  delay: 5
  until: monitoring_prometheus_ready.status == 200
  check_mode: false
  when: not ansible_check_mode

- name: Read active Prometheus runtime flags
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/status/flags
    return_content: true
    status_code: 200
  register: monitoring_prometheus_runtime_flags
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Restart Prometheus when installed receiver flags are not active
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
  when:
    - not ansible_check_mode
    - >-
      monitoring_prometheus_runtime_flags.json.data['web.enable-remote-write-receiver']
      | default('false') != 'true'
      or 'exemplar-storage' not in
         (monitoring_prometheus_runtime_flags.json.data['enable-feature'] | default(''))

- name: Wait for Prometheus after runtime flag recovery
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/-/ready
    return_content: true
    status_code: 200
  register: monitoring_prometheus_recovered
  retries: 12
  delay: 5
  until: monitoring_prometheus_recovered.status == 200
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Verify active Prometheus receiver flags
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/status/flags
    return_content: true
    status_code: 200
  register: monitoring_prometheus_verified_flags
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Confirm Prometheus accepts remote writes and exemplars
  ansible.builtin.assert:
    that:
      - >-
        monitoring_prometheus_verified_flags.json.data['web.enable-remote-write-receiver']
        | default('false') == 'true'
      - >-
        'exemplar-storage' in
        (monitoring_prometheus_verified_flags.json.data['enable-feature'] | default(''))
    fail_msg: Prometheus is not running with its configured telemetry receiver flags.
    quiet: true
  when: not ansible_check_mode

- name: Read loaded Prometheus rule groups
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/rules
    return_content: true
    status_code: 200
  register: monitoring_prometheus_loaded_rules
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Confirm home-budget Prometheus rules are active
  ansible.builtin.assert:
    that:
      - >-
        'home-budget-recording' in
        (monitoring_prometheus_loaded_rules.json.data.groups
         | map(attribute='name') | list)
      - >-
        'home-budget-alerts' in
        (monitoring_prometheus_loaded_rules.json.data.groups
         | map(attribute='name') | list)
    fail_msg: Prometheus did not load the home-budget recording and alerting rules.
    quiet: true
  when: not ansible_check_mode

- name: Wait for Alloy OTLP listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ monitoring_otel_port }}"
    state: started
    timeout: 30
  when: not ansible_check_mode

- name: Wait for Alloy metrics endpoint on loopback
  ansible.builtin.uri:
    url: "http://{{ monitoring_alloy_metrics_target }}/metrics"
    return_content: false
    status_code: 200
  register: monitoring_alloy_metrics_ready
  retries: 12
  delay: 5
  until: monitoring_alloy_metrics_ready.status == 200
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Wait for Prometheus to scrape Alloy metrics
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22alloy%22%7D
    return_content: true
    status_code: 200
  register: monitoring_prometheus_alloy_target
  retries: 12
  delay: 5
  until: >-
    monitoring_prometheus_alloy_target.json.status == 'success'
    and monitoring_prometheus_alloy_target.json.data.result | length > 0
    and monitoring_prometheus_alloy_target.json.data.result[0].value[1] == '1'
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Wait for Grafana before datasource reconciliation
  ansible.builtin.uri:
    url: "{{ monitoring_grafana_url }}/api/health"
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_grafana_ready
  retries: 12
  delay: 5
  until: monitoring_grafana_ready.status == 200
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Remove retired temporary Loki storage
  ansible.builtin.file:
    path: /tmp/loki
    state: absent

- name: Probe Loki without a client identity
  ansible.builtin.uri:
    url: "https://{{ monitoring_loki_hostname }}:{{ monitoring_loki_port }}/ready"
    ca_path: "{{ monitoring_alloy_dir }}/brown-rook-root-ca.crt"
    validate_certs: true
    status_code: 200
  register: monitoring_loki_anonymous_probe
  failed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Verify the selected client-authentication stage
  ansible.builtin.assert:
    that:
      - >-
        (monitoring_loki_stage == 'optional' and monitoring_loki_anonymous_probe.status == 200)
        or
        (monitoring_loki_stage == 'enforced' and monitoring_loki_anonymous_probe.status != 200)
    fail_msg: "Loki client-authentication behavior does not match {{ monitoring_loki_stage }}"
    quiet: true
  when: not ansible_check_mode

- name: Read Grafana client certificate
  ansible.builtin.slurp:
    src: "{{ monitoring_grafana_cert_source }}"
  become: false
  delegate_to: localhost
  run_once: true
  register: monitoring_grafana_cert_data
  no_log: true

- name: Read Grafana client key
  ansible.builtin.slurp:
    src: "{{ monitoring_grafana_key_source }}"
  become: false
  delegate_to: localhost
  run_once: true
  register: monitoring_grafana_key_data
  no_log: true

- name: Calculate Grafana secure-input revision
  ansible.builtin.set_fact:
    monitoring_grafana_secure_revision: >-
      {{ ([monitoring_root_ca_data.content, monitoring_grafana_cert_data.content,
            monitoring_grafana_key_data.content] | join(':')) | hash('sha256') }}
  no_log: true

- name: Inspect Grafana secure-input marker
  ansible.builtin.stat:
    path: "{{ monitoring_grafana_secret_marker }}"
  register: monitoring_grafana_marker_stat

- name: Read Grafana secure-input marker
  ansible.builtin.slurp:
    src: "{{ monitoring_grafana_secret_marker }}"
  when: monitoring_grafana_marker_stat.stat.exists
  register: monitoring_grafana_marker_data
  no_log: true

- name: Read Grafana Loki datasource
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/datasources/uid/{{ monitoring_grafana_datasource_uid }}
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: [200, 404]
  register: monitoring_grafana_datasource
  check_mode: false
  no_log: true

- name: Define Loki-to-Tempo derived fields
  ansible.builtin.set_fact:
    monitoring_grafana_loki_derived_fields:
      - name: TraceID
        matcherRegex: '"trace_id"\s*:\s*"([0-9a-fA-F]{32})"'
        url: '${__value.raw}'
        urlDisplayLabel: View trace
        datasourceUid: "{{ monitoring_grafana_tempo_datasource_uid }}"

- name: Determine whether Grafana datasource needs reconciliation
  ansible.builtin.set_fact:
    monitoring_grafana_datasource_needs_update: >-
      {{
        monitoring_grafana_datasource.status != 200
        or monitoring_grafana_datasource.json.name | default('') != monitoring_grafana_datasource_name
        or monitoring_grafana_datasource.json.type | default('') != 'loki'
        or monitoring_grafana_datasource.json.access | default('') != 'proxy'
        or monitoring_grafana_datasource.json.url | default('') != 'https://' ~ monitoring_loki_hostname ~ ':' ~ monitoring_loki_port
        or (monitoring_grafana_datasource.json.isDefault | default(true))
        or not (monitoring_grafana_datasource.json.jsonData.tlsAuth | default(false))
        or not (monitoring_grafana_datasource.json.jsonData.tlsAuthWithCACert | default(false))
        or (monitoring_grafana_datasource.json.jsonData.tlsSkipVerify | default(true))
        or monitoring_grafana_datasource.json.jsonData.serverName | default('') != monitoring_loki_hostname
        or not (monitoring_grafana_datasource.json.secureJsonFields.tlsCACert | default(false))
        or not (monitoring_grafana_datasource.json.secureJsonFields.tlsClientCert | default(false))
        or not (monitoring_grafana_datasource.json.secureJsonFields.tlsClientKey | default(false))
        or (monitoring_grafana_datasource.json.jsonData.derivedFields | default([])
            != monitoring_grafana_loki_derived_fields)
        or ((monitoring_grafana_marker_data.content | default('') | b64decode | trim)
            != monitoring_grafana_secure_revision)
      }}
  no_log: true

- name: Define Grafana Loki datasource payload
  ansible.builtin.set_fact:
    monitoring_grafana_datasource_payload:
      uid: "{{ monitoring_grafana_datasource_uid }}"
      name: "{{ monitoring_grafana_datasource_name }}"
      type: loki
      access: proxy
      url: "https://{{ monitoring_loki_hostname }}:{{ monitoring_loki_port }}"
      isDefault: false
      jsonData:
        tlsAuth: true
        tlsAuthWithCACert: true
        tlsSkipVerify: false
        serverName: "{{ monitoring_loki_hostname }}"
        derivedFields: "{{ monitoring_grafana_loki_derived_fields }}"
      secureJsonData:
        tlsCACert: "{{ monitoring_root_ca_data.content | b64decode }}"
        tlsClientCert: "{{ monitoring_grafana_cert_data.content | b64decode }}"
        tlsClientKey: "{{ monitoring_grafana_key_data.content | b64decode }}"
  no_log: true

- name: Create Grafana Loki datasource
  ansible.builtin.uri:
    url: "{{ monitoring_grafana_url }}/api/datasources"
    method: POST
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body: "{{ monitoring_grafana_datasource_payload }}"
    status_code: 200
  when:
    - not ansible_check_mode
    - monitoring_grafana_datasource.status == 404
  no_log: true

- name: Update Grafana Loki datasource
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/datasources/uid/{{ monitoring_grafana_datasource_uid }}
    method: PUT
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body: "{{ monitoring_grafana_datasource_payload }}"
    status_code: 200
  when:
    - not ansible_check_mode
    - monitoring_grafana_datasource.status == 200
    - monitoring_grafana_datasource_needs_update
  no_log: true

- name: Record reconciled Grafana secure-input revision
  ansible.builtin.copy:
    content: "{{ monitoring_grafana_secure_revision }}\n"
    dest: "{{ monitoring_grafana_secret_marker }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode
    - monitoring_grafana_datasource_needs_update
  no_log: true

- name: Report pending Grafana datasource reconciliation in check mode
  ansible.builtin.debug:
    msg: Grafana Loki datasource would be reconciled.
  when:
    - ansible_check_mode
    - monitoring_grafana_datasource_needs_update

- name: Verify Grafana Loki datasource health
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/datasources/uid/{{ monitoring_grafana_datasource_uid }}/health
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_grafana_health
  when: not ansible_check_mode
  check_mode: false
  no_log: true

- name: Confirm Grafana can query Loki
  ansible.builtin.assert:
    that:
      - monitoring_grafana_health.json.status == 'OK'
    fail_msg: Grafana could not connect to Loki with its client identity.
    quiet: true
  when: not ansible_check_mode
  no_log: true

- name: Read Grafana Tempo datasource
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/datasources/uid/{{ monitoring_grafana_tempo_datasource_uid }}
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: [200, 404]
  register: monitoring_grafana_tempo_datasource
  check_mode: false
  no_log: true

- name: Define Grafana Tempo datasource payload
  ansible.builtin.set_fact:
    monitoring_grafana_tempo_datasource_payload:
      uid: "{{ monitoring_grafana_tempo_datasource_uid }}"
      name: "{{ monitoring_grafana_tempo_datasource_name }}"
      type: tempo
      access: proxy
      url: >-
        http://{{ monitoring_tempo_http_address }}:{{ monitoring_tempo_http_port }}
      isDefault: false
      jsonData:
        httpMethod: GET
        nodeGraph:
          enabled: true
        tracesToLogsV2:
          datasourceUid: "{{ monitoring_grafana_datasource_uid }}"
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          tags:
            - {key: service.name, value: service}
            - {key: k8s.namespace.name, value: namespace}
            - {key: k8s.pod.name, value: pod}
          filterByTraceID: true
          filterBySpanID: true
          customQuery: false
        tracesToMetrics:
          datasourceUid: "{{ monitoring_grafana_prometheus_datasource_uid }}"
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          tags:
            - {key: service.name, value: service}
          queries:
            - name: Receipt throughput
              query: 'sum(rate(brownrook_receipt_processed_total{$__tags}[5m]))'
            - name: Receipt duration p95
              query: >-
                histogram_quantile(0.95,
                sum by (le)
                (rate(brownrook_receipt_processing_duration_seconds_bucket{$__tags}[5m])))

- name: Determine whether Grafana Tempo datasource needs reconciliation
  ansible.builtin.set_fact:
    monitoring_grafana_tempo_datasource_needs_update: >-
      {{
        monitoring_grafana_tempo_datasource.status != 200
        or monitoring_grafana_tempo_datasource.json.name | default('') != monitoring_grafana_tempo_datasource_name
        or monitoring_grafana_tempo_datasource.json.type | default('') != 'tempo'
        or monitoring_grafana_tempo_datasource.json.access | default('') != 'proxy'
        or monitoring_grafana_tempo_datasource.json.url | default('') != 'http://' ~ monitoring_tempo_http_address ~ ':' ~ monitoring_tempo_http_port
        or (monitoring_grafana_tempo_datasource.json.isDefault | default(true))
        or not (monitoring_grafana_tempo_datasource.json.jsonData.nodeGraph.enabled | default(false))
        or (monitoring_grafana_tempo_datasource.json.jsonData.tracesToLogsV2 | default({})
            != monitoring_grafana_tempo_datasource_payload.jsonData.tracesToLogsV2)
        or (monitoring_grafana_tempo_datasource.json.jsonData.tracesToMetrics | default({})
            != monitoring_grafana_tempo_datasource_payload.jsonData.tracesToMetrics)
      }}

- name: Create Grafana Tempo datasource
  ansible.builtin.uri:
    url: "{{ monitoring_grafana_url }}/api/datasources"
    method: POST
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body: "{{ monitoring_grafana_tempo_datasource_payload }}"
    status_code: 200
  when:
    - not ansible_check_mode
    - monitoring_grafana_tempo_datasource.status == 404
  no_log: true

- name: Update Grafana Tempo datasource
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/datasources/uid/{{ monitoring_grafana_tempo_datasource_uid }}
    method: PUT
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body: "{{ monitoring_grafana_tempo_datasource_payload }}"
    status_code: 200
  when:
    - not ansible_check_mode
    - monitoring_grafana_tempo_datasource.status == 200
    - monitoring_grafana_tempo_datasource_needs_update
  no_log: true

- name: Report pending Grafana Tempo datasource reconciliation in check mode
  ansible.builtin.debug:
    msg: Grafana Tempo datasource would be reconciled.
  when:
    - ansible_check_mode
    - monitoring_grafana_tempo_datasource_needs_update

- name: Verify Grafana Tempo datasource health
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/datasources/uid/{{ monitoring_grafana_tempo_datasource_uid }}/health
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_grafana_tempo_health
  when: not ansible_check_mode
  check_mode: false
  no_log: true

- name: Confirm Grafana can query Tempo
  ansible.builtin.assert:
    that:
      - monitoring_grafana_tempo_health.json.status == 'OK'
    fail_msg: Grafana could not connect to Tempo over loopback.
    quiet: true
  when: not ansible_check_mode
  no_log: true

- name: Read provisioned Grafana Prometheus datasource
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/datasources/uid/{{ monitoring_grafana_prometheus_datasource_uid }}
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: [200, 404]
  register: monitoring_grafana_prometheus_datasource
  check_mode: false
  no_log: true

- name: Determine whether Grafana Prometheus datasource needs activation
  ansible.builtin.set_fact:
    monitoring_grafana_prometheus_provisioning_needs_activation: >-
      {{
        monitoring_grafana_prometheus_datasource.status != 200
        or monitoring_grafana_prometheus_datasource.json.name | default('')
           != monitoring_grafana_prometheus_datasource_name
        or monitoring_grafana_prometheus_datasource.json.type | default('')
           != 'prometheus'
        or monitoring_grafana_prometheus_datasource.json.url | default('')
           != 'http://127.0.0.1:9090'
        or monitoring_grafana_tempo_datasource_uid not in
           (monitoring_grafana_prometheus_datasource.json.jsonData.exemplarTraceIdDestinations
            | default([])
            | selectattr('name', 'equalto', 'trace_id')
            | map(attribute='datasourceUid') | list)
      }}
  no_log: true

- name: Report pending Grafana Prometheus datasource activation in check mode
  ansible.builtin.debug:
    msg: Grafana Prometheus datasource would be activated from its provisioned definition.
  when:
    - ansible_check_mode
    - monitoring_grafana_prometheus_provisioning_needs_activation

- name: Restart Grafana when its provisioned Prometheus datasource is not active
  ansible.builtin.systemd_service:
    name: grafana-server
    state: restarted
  when:
    - not ansible_check_mode
    - monitoring_grafana_prometheus_provisioning_needs_activation

- name: Wait for Grafana after Prometheus datasource activation
  ansible.builtin.uri:
    url: "{{ monitoring_grafana_url }}/api/health"
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_grafana_prometheus_provisioning_ready
  retries: 12
  delay: 5
  until: monitoring_grafana_prometheus_provisioning_ready.status == 200
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - monitoring_grafana_prometheus_provisioning_needs_activation

- name: Read native Grafana folders
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/apis/folder.grafana.app/v1/namespaces/{{ monitoring_grafana_api_namespace }}/folders
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_grafana_folder_list
  changed_when: false
  check_mode: false
  no_log: true

- name: Adopt existing Grafana folder identities by title
  ansible.builtin.set_fact:
    monitoring_grafana_home_budget_folder_uid_effective: >-
      {{
        (monitoring_grafana_folder_list.json.items | default([])
         | selectattr('spec.title', 'equalto', monitoring_grafana_home_budget_folder_title)
         | map(attribute='metadata.name') | list | first)
        | default(monitoring_grafana_home_budget_folder_uid, true)
      }}
    monitoring_grafana_brown_rook_folder_uid_effective: >-
      {{
        (monitoring_grafana_folder_list.json.items | default([])
         | selectattr('spec.title', 'equalto', monitoring_grafana_brown_rook_folder_title)
         | map(attribute='metadata.name') | list | first)
        | default(monitoring_grafana_brown_rook_folder_uid, true)
      }}
  no_log: true

- name: Inspect legacy Grafana dashboard files before native migration
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ monitoring_grafana_legacy_dashboard_provisioning_path }}"
    - "{{ monitoring_grafana_legacy_dashboard_dir }}"
  register: monitoring_grafana_legacy_dashboard_files
  changed_when: false
  check_mode: false

- name: Determine whether legacy Grafana dashboard cleanup is required
  ansible.builtin.set_fact:
    monitoring_grafana_legacy_dashboard_cleanup_required: >-
      {{
        monitoring_grafana_legacy_dashboard_files.results
        | selectattr('stat.exists') | list | length > 0
      }}

- name: Report pending legacy Grafana dashboard migration in check mode
  ansible.builtin.debug:
    msg: >-
      Grafana would be stopped briefly while classic file provisioning is
      removed. The same dashboard UIDs would then be recreated through the
      native v2 API; an existing external-share token remains associated with
      its dashboard UID.
  when:
    - ansible_check_mode
    - monitoring_grafana_legacy_dashboard_cleanup_required

- name: Stop Grafana before removing classic dashboard provisioning
  ansible.builtin.systemd_service:
    name: grafana-server
    state: stopped
  when:
    - not ansible_check_mode
    - monitoring_grafana_legacy_dashboard_cleanup_required

- name: Remove classic Grafana dashboard provisioning
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ monitoring_grafana_legacy_dashboard_provisioning_path }}"
    - "{{ monitoring_grafana_legacy_dashboard_dir }}"
  when:
    - not ansible_check_mode
    - monitoring_grafana_legacy_dashboard_cleanup_required

- name: Start Grafana without classic dashboard provisioning
  ansible.builtin.systemd_service:
    name: grafana-server
    state: started
  when:
    - not ansible_check_mode
    - monitoring_grafana_legacy_dashboard_cleanup_required

- name: Wait for Grafana after removing classic dashboard provisioning
  ansible.builtin.uri:
    url: "{{ monitoring_grafana_url }}/api/health"
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_grafana_native_migration_ready
  retries: 12
  delay: 5
  until: monitoring_grafana_native_migration_ready.status == 200
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - monitoring_grafana_legacy_dashboard_cleanup_required

- name: Define native Grafana folder resources
  ansible.builtin.set_fact:
    monitoring_grafana_folder_resources:
      - label: Home Budget
        resource:
          apiVersion: folder.grafana.app/v1
          kind: Folder
          metadata:
            name: "{{ monitoring_grafana_home_budget_folder_uid_effective }}"
          spec:
            title: "{{ monitoring_grafana_home_budget_folder_title }}"
      - label: Brown Rook
        resource:
          apiVersion: folder.grafana.app/v1
          kind: Folder
          metadata:
            name: "{{ monitoring_grafana_brown_rook_folder_uid_effective }}"
          spec:
            title: "{{ monitoring_grafana_brown_rook_folder_title }}"

- name: Read reconciled native Grafana folders
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/apis/folder.grafana.app/v1/namespaces/{{ monitoring_grafana_api_namespace }}/folders/{{ item.resource.metadata.name }}
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: [200, 404]
  loop: "{{ monitoring_grafana_folder_resources }}"
  loop_control:
    label: "{{ item.label }}"
  register: monitoring_grafana_folders_current
  changed_when: false
  check_mode: false
  no_log: true

- name: Create missing native Grafana folders
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/apis/folder.grafana.app/v1/namespaces/{{ monitoring_grafana_api_namespace }}/folders
    method: POST
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body: "{{ item.item.resource }}"
    status_code: 201
  loop: "{{ monitoring_grafana_folders_current.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when:
    - not ansible_check_mode
    - item.status == 404
  no_log: true

- name: Update changed native Grafana folders
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/apis/folder.grafana.app/v1/namespaces/{{ monitoring_grafana_api_namespace }}/folders/{{ item.item.resource.metadata.name }}
    method: PUT
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body:
      apiVersion: folder.grafana.app/v1
      kind: Folder
      metadata:
        name: "{{ item.item.resource.metadata.name }}"
        resourceVersion: "{{ item.json.metadata.resourceVersion }}"
        annotations: {}
      spec: "{{ item.item.resource.spec }}"
    status_code: 200
  loop: "{{ monitoring_grafana_folders_current.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when:
    - not ansible_check_mode
    - item.status == 200
    - >-
      item.json.spec != item.item.resource.spec
      or (item.json.metadata.annotations | default({})).get('grafana.app/managedBy', '')
         == 'classic-file-provisioning'
  no_log: true

- name: Report pending native Grafana folder reconciliation in check mode
  ansible.builtin.debug:
    msg: "Grafana folder {{ item.item.label }} would be reconciled through the folder v1 API."
  loop: "{{ monitoring_grafana_folders_current.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when:
    - ansible_check_mode
    - >-
      item.status == 404
      or item.json.spec != item.item.resource.spec
      or (item.json.metadata.annotations | default({})).get('grafana.app/managedBy', '')
         == 'classic-file-provisioning'

- name: Define native Grafana v2 dashboard resources
  ansible.builtin.set_fact:
    monitoring_grafana_dashboard_resources:
      - label: receipt telemetry
        resource: >-
          {{ lookup('ansible.builtin.template', 'grafana-receipt-telemetry-dashboard.json.j2') | from_json }}
      - label: OCR performance
        resource: >-
          {{ lookup('ansible.builtin.template', 'grafana-ocr-performance-dashboard.json.j2') | from_json }}
      - label: public live demo
        resource: >-
          {{ lookup('ansible.builtin.template', 'grafana-public-live-demo-dashboard.json.j2') | from_json }}
  no_log: true

- name: Read native Grafana v2 dashboards
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/apis/dashboard.grafana.app/v2/namespaces/{{ monitoring_grafana_api_namespace }}/dashboards/{{ item.resource.metadata.name }}
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: [200, 404]
  loop: "{{ monitoring_grafana_dashboard_resources }}"
  loop_control:
    label: "{{ item.label }}"
  register: monitoring_grafana_dashboards_current
  changed_when: false
  check_mode: false
  no_log: true

- name: Create missing native Grafana v2 dashboards
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/apis/dashboard.grafana.app/v2/namespaces/{{ monitoring_grafana_api_namespace }}/dashboards
    method: POST
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body: "{{ item.item.resource }}"
    status_code: 201
  loop: "{{ monitoring_grafana_dashboards_current.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when:
    - not ansible_check_mode
    - item.status == 404
  no_log: true

- name: Update changed native Grafana v2 dashboards
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/apis/dashboard.grafana.app/v2/namespaces/{{ monitoring_grafana_api_namespace }}/dashboards/{{ item.item.resource.metadata.name }}
    method: PUT
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body:
      apiVersion: dashboard.grafana.app/v2
      kind: Dashboard
      metadata:
        name: "{{ item.item.resource.metadata.name }}"
        resourceVersion: "{{ item.json.metadata.resourceVersion }}"
        annotations: "{{ item.item.resource.metadata.annotations }}"
      spec: "{{ item.item.resource.spec }}"
    status_code: 200
  loop: "{{ monitoring_grafana_dashboards_current.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when:
    - not ansible_check_mode
    - item.status == 200
    - >-
      item.json.spec != item.item.resource.spec
      or (item.json.metadata.annotations | default({})).get('grafana.app/folder', '')
         != item.item.resource.metadata.annotations['grafana.app/folder']
      or (item.json.metadata.annotations | default({})).get('grafana.app/managedBy', '')
         == 'classic-file-provisioning'
  no_log: true

- name: Report pending native Grafana v2 dashboard reconciliation in check mode
  ansible.builtin.debug:
    msg: "Grafana v2 dashboard {{ item.item.label }} would be reconciled."
  loop: "{{ monitoring_grafana_dashboards_current.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when:
    - ansible_check_mode
    - >-
      item.status == 404
      or item.json.spec != item.item.resource.spec
      or (item.json.metadata.annotations | default({})).get('grafana.app/folder', '')
         != item.item.resource.metadata.annotations['grafana.app/folder']
      or (item.json.metadata.annotations | default({})).get('grafana.app/managedBy', '')
         == 'classic-file-provisioning'

- name: Verify provisioned Grafana Prometheus datasource
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/datasources/uid/{{ monitoring_grafana_prometheus_datasource_uid }}
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: [200, 404]
  register: monitoring_grafana_prometheus_verified
  retries: 6
  delay: 5
  until: monitoring_grafana_prometheus_verified.status == 200
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Verify native Grafana folders
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/apis/folder.grafana.app/v1/namespaces/{{ monitoring_grafana_api_namespace }}/folders/{{ item.resource.metadata.name }}
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: [200, 404]
  loop: "{{ monitoring_grafana_folder_resources }}"
  loop_control:
    label: "{{ item.label }}"
  register: monitoring_grafana_folders_verified
  retries: 6
  delay: 5
  until: monitoring_grafana_folders_verified.status == 200
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Verify native Grafana v2 dashboards
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/apis/dashboard.grafana.app/v2/namespaces/{{ monitoring_grafana_api_namespace }}/dashboards/{{ item.resource.metadata.name }}
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: [200, 404]
  loop: "{{ monitoring_grafana_dashboard_resources }}"
  loop_control:
    label: "{{ item.label }}"
  register: monitoring_grafana_dashboards_verified
  retries: 6
  delay: 5
  until: monitoring_grafana_dashboards_verified.status == 200
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Confirm native Grafana folders
  ansible.builtin.assert:
    that:
      - item.status == 200
      - item.json.apiVersion == 'folder.grafana.app/v1'
      - item.json.kind == 'Folder'
      - item.json.spec == item.item.resource.spec
      - "'grafana.app/managedBy' not in (item.json.metadata.annotations | default({}))"
    fail_msg: "Grafana folder {{ item.item.label }} did not reconcile through the native API."
    quiet: true
  loop: "{{ monitoring_grafana_folders_verified.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when: not ansible_check_mode
  no_log: true

- name: Confirm native Grafana v2 dashboards
  ansible.builtin.assert:
    that:
      - item.status == 200
      - item.json.apiVersion == 'dashboard.grafana.app/v2'
      - item.json.kind == 'Dashboard'
      - item.json.spec == item.item.resource.spec
      - >-
        item.json.metadata.annotations['grafana.app/folder']
        == item.item.resource.metadata.annotations['grafana.app/folder']
      - "'grafana.app/managedBy' not in (item.json.metadata.annotations | default({}))"
    fail_msg: "Grafana v2 dashboard {{ item.item.label }} did not reconcile."
    quiet: true
  loop: "{{ monitoring_grafana_dashboards_verified.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when: not ansible_check_mode
  no_log: true

- name: Confirm Grafana telemetry resources
  ansible.builtin.assert:
    that:
      - monitoring_grafana_prometheus_verified.json.url == 'http://127.0.0.1:9090'
      - >-
        monitoring_grafana_tempo_datasource_uid in
        (monitoring_grafana_prometheus_verified.json.jsonData.exemplarTraceIdDestinations
         | selectattr('name', 'equalto', 'trace_id')
         | map(attribute='datasourceUid') | list)
    fail_msg: Grafana did not activate the Prometheus datasource.
    quiet: true
  when: not ansible_check_mode
  no_log: true

- name: Read effective Grafana security settings
  ansible.builtin.uri:
    url: "{{ monitoring_grafana_url }}/api/admin/settings"
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_grafana_security_settings
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Confirm only externally shared dashboards bypass authentication
  ansible.builtin.assert:
    that:
      - monitoring_grafana_security_settings.json['auth.anonymous'].enabled == 'false'
      - monitoring_grafana_security_settings.json['public_dashboards'].enabled == 'true'
    fail_msg: >-
      Grafana must keep global anonymous access disabled while externally
      shared dashboards remain enabled.
    quiet: true
  when: not ansible_check_mode
  no_log: true

- name: Read Grafana external-sharing state for the public live demo
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/dashboards/uid/{{ monitoring_grafana_public_demo_dashboard_uid }}/public-dashboards
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: [200, 404]
  register: monitoring_grafana_public_demo_share
  changed_when: false
  check_mode: false
  no_log: true

- name: Define Grafana external-sharing payload
  ansible.builtin.set_fact:
    monitoring_grafana_public_demo_share_payload:
      accessToken: "{{ monitoring_grafana_public_demo_access_token }}"
      isEnabled: "{{ monitoring_grafana_public_demo_enabled | bool }}"
      annotationsEnabled: "{{ monitoring_grafana_public_demo_annotations_enabled | bool }}"
      timeSelectionEnabled: "{{ monitoring_grafana_public_demo_time_selection_enabled | bool }}"
      share: public
  no_log: true

- name: Report pending Grafana external sharing in check mode
  ansible.builtin.debug:
    msg: >-
      Grafana external sharing for the sanitized live-demo dashboard would be
      {{ 'enabled' if monitoring_grafana_public_demo_enabled else 'disabled' }}.
  when:
    - ansible_check_mode
    - >-
      (monitoring_grafana_public_demo_share.status == 404
       and monitoring_grafana_public_demo_enabled)
      or
      (monitoring_grafana_public_demo_share.status == 200
       and
       (monitoring_grafana_public_demo_share.json.isEnabled | default(false) | bool
        != monitoring_grafana_public_demo_enabled | bool
        or monitoring_grafana_public_demo_share.json.annotationsEnabled
           | default(true) | bool
           != monitoring_grafana_public_demo_annotations_enabled | bool
        or monitoring_grafana_public_demo_share.json.timeSelectionEnabled
           | default(true) | bool
           != monitoring_grafana_public_demo_time_selection_enabled | bool))

- name: Enable external sharing for the Grafana public live demo
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/dashboards/uid/{{ monitoring_grafana_public_demo_dashboard_uid }}/public-dashboards
    method: POST
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body: "{{ monitoring_grafana_public_demo_share_payload }}"
    return_content: true
    status_code: [200, 201]
  register: monitoring_grafana_public_demo_share_created
  when:
    - not ansible_check_mode
    - monitoring_grafana_public_demo_enabled
    - monitoring_grafana_public_demo_share.status == 404
  no_log: true

- name: Reconcile external sharing for the Grafana public live demo
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/dashboards/uid/{{ monitoring_grafana_public_demo_dashboard_uid }}/public-dashboards/{{ monitoring_grafana_public_demo_share.json.uid }}
    method: PATCH
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    body_format: json
    body: "{{ monitoring_grafana_public_demo_share_payload }}"
    return_content: true
    status_code: 200
  when:
    - not ansible_check_mode
    - monitoring_grafana_public_demo_share.status == 200
    - >-
      monitoring_grafana_public_demo_share.json.isEnabled | default(false) | bool
      != monitoring_grafana_public_demo_enabled | bool
      or monitoring_grafana_public_demo_share.json.annotationsEnabled
         | default(true) | bool
         != monitoring_grafana_public_demo_annotations_enabled | bool
      or monitoring_grafana_public_demo_share.json.timeSelectionEnabled
         | default(true) | bool
         != monitoring_grafana_public_demo_time_selection_enabled | bool
  no_log: true

- name: Verify Grafana external-sharing state for the public live demo
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/dashboards/uid/{{ monitoring_grafana_public_demo_dashboard_uid }}/public-dashboards
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_grafana_public_demo_share_verified
  retries: 6
  delay: 5
  until: >-
    monitoring_grafana_public_demo_share_verified.status == 200
    and monitoring_grafana_public_demo_share_verified.json.isEnabled | bool
       == monitoring_grafana_public_demo_enabled | bool
    and monitoring_grafana_public_demo_share_verified.json.annotationsEnabled | bool
       == monitoring_grafana_public_demo_annotations_enabled | bool
    and monitoring_grafana_public_demo_share_verified.json.timeSelectionEnabled | bool
       == monitoring_grafana_public_demo_time_selection_enabled | bool
    and (monitoring_grafana_public_demo_access_token | length == 0
         or monitoring_grafana_public_demo_share_verified.json.accessToken
            == monitoring_grafana_public_demo_access_token)
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - not ansible_check_mode
    - monitoring_grafana_public_demo_enabled

- name: Verify the public live-demo route without Grafana credentials
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_public_demo_external_url }}/public-dashboards/{{ monitoring_grafana_public_demo_share_verified.json.accessToken }}
    method: GET
    validate_certs: true
    follow_redirects: all
    return_content: false
    status_code: 200
  become: false
  delegate_to: localhost
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - monitoring_grafana_public_demo_enabled

- name: Verify ordinary Grafana routes are absent from the public hostname
  ansible.builtin.uri:
    url: "{{ monitoring_grafana_public_demo_external_url }}{{ item }}"
    method: GET
    validate_certs: true
    follow_redirects: none
    status_code: 404
  become: false
  delegate_to: localhost
  loop:
    - /
    - /login
    - /explore
    - /api/health
    - /api/search
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - monitoring_grafana_public_demo_enabled

- name: Report the revocable Grafana public live-demo URL
  ansible.builtin.debug:
    msg: >-
      Public live demo: {{ monitoring_grafana_public_demo_external_url }}/public-dashboards/{{ monitoring_grafana_public_demo_share_verified.json.accessToken }}
  when:
    - not ansible_check_mode
    - monitoring_grafana_public_demo_enabled

- name: Verify Grafana Prometheus datasource health
  ansible.builtin.uri:
    url: >-
      {{ monitoring_grafana_url }}/api/datasources/uid/{{ monitoring_grafana_prometheus_datasource_uid }}/health
    method: GET
    url_username: "{{ monitoring_grafana_admin_user }}"
    url_password: "{{ monitoring_grafana_admin_password }}"
    force_basic_auth: true
    ca_path: "{{ monitoring_system_root_ca_path }}"
    validate_certs: true
    return_content: true
    status_code: 200
  register: monitoring_grafana_prometheus_health
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  no_log: true

- name: Confirm Grafana can query Prometheus
  ansible.builtin.assert:
    that:
      - monitoring_grafana_prometheus_health.json.status == 'OK'
    fail_msg: Grafana could not connect to Prometheus over loopback.
    quiet: true
  when: not ansible_check_mode
  no_log: true
