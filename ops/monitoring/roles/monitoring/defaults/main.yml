---
monitoring_repo_root: "{{ playbook_dir | dirname | dirname }}"

# Secret inputs are resolved on the controller and are never copied into Git.
monitoring_pki_dir: "{{ lookup('ansible.builtin.env', 'MONITORING_PKI_DIR') }}"
monitoring_alloy_kubeconfig: >-
  {{ lookup('ansible.builtin.env', 'MONITORING_ALLOY_KUBECONFIG') }}
monitoring_admin_kubeconfig: >-
  {{ lookup('ansible.builtin.env', 'MONITORING_ADMIN_KUBECONFIG') }}
monitoring_grafana_admin_user: >-
  {{ lookup('ansible.builtin.env', 'MONITORING_GRAFANA_ADMIN_USER') | default('admin', true) }}
monitoring_grafana_admin_password: >-
  {{ lookup('ansible.builtin.env', 'MONITORING_GRAFANA_ADMIN_PASSWORD') }}

monitoring_root_ca_source: "{{ monitoring_pki_dir }}/root/root_ca.crt"
monitoring_intermediate_ca_source: "{{ monitoring_pki_dir }}/intermediate/intermediate_ca.crt"
monitoring_server_cert_source: "{{ monitoring_pki_dir }}/leafs/monitoring/monitoring.fullchain.crt"
monitoring_server_key_source: "{{ monitoring_pki_dir }}/leafs/monitoring/monitoring.key"
monitoring_alloy_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/alloy-loki-client/alloy-loki-client.fullchain.crt
monitoring_alloy_key_source: >-
  {{ monitoring_pki_dir }}/leafs/alloy-loki-client/alloy-loki-client.key
monitoring_grafana_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/grafana-loki-client/grafana-loki-client.fullchain.crt
monitoring_grafana_key_source: >-
  {{ monitoring_pki_dir }}/leafs/grafana-loki-client/grafana-loki-client.key
monitoring_fluent_bit_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/fluent-bit-loki-client/fluent-bit-loki-client.fullchain.crt
monitoring_fluent_bit_key_source: >-
  {{ monitoring_pki_dir }}/leafs/fluent-bit-loki-client/fluent-bit-loki-client.key
monitoring_otel_backend_server_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/otel-backend-server/otel-backend-server.fullchain.crt
monitoring_otel_backend_server_key_source: >-
  {{ monitoring_pki_dir }}/leafs/otel-backend-server/otel-backend-server.key
monitoring_receipt_telemetry_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/receipt-telemetry-client/receipt-telemetry-client.fullchain.crt
monitoring_receipt_telemetry_key_source: >-
  {{ monitoring_pki_dir }}/leafs/receipt-telemetry-client/receipt-telemetry-client.key
monitoring_otel_collector_server_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/otel-collector-server/otel-collector-server.fullchain.crt
monitoring_otel_collector_server_key_source: >-
  {{ monitoring_pki_dir }}/leafs/otel-collector-server/otel-collector-server.key
monitoring_otel_collector_backend_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/otel-collector-backend-client/otel-collector-backend-client.fullchain.crt
monitoring_otel_collector_backend_key_source: >-
  {{ monitoring_pki_dir }}/leafs/otel-collector-backend-client/otel-collector-backend-client.key

monitoring_loki_config_path: /etc/loki/config.yml
monitoring_loki_log_level: info
monitoring_loki_storage_path: /var/lib/loki
monitoring_loki_retention_period: 336h
monitoring_loki_compaction_interval: 10m
monitoring_loki_retention_delete_delay: 2h
monitoring_loki_retention_delete_worker_count: 10
monitoring_tempo_version: "3.0.3"
monitoring_tempo_config_path: /etc/tempo/config.yml
monitoring_tempo_storage_path: /var/lib/tempo
monitoring_tempo_work_path: /var/tempo
monitoring_tempo_http_address: 127.0.0.1
monitoring_tempo_http_port: 3200
monitoring_tempo_otlp_address: 127.0.0.1
monitoring_tempo_otlp_port: 14317
monitoring_tempo_retention_period: 336h
monitoring_prometheus_version: "2.53.3"
monitoring_prometheus_defaults_path: /etc/default/prometheus
monitoring_prometheus_config_path: /etc/prometheus/prometheus.yml
monitoring_prometheus_rules_dir: /etc/prometheus/rules
monitoring_prometheus_rules_path: /etc/prometheus/rules/home-budget.yml
monitoring_alloy_metrics_target: 127.0.0.1:12345
monitoring_prometheus_args: >-
  --web.listen-address=127.0.0.1:9090
  --web.enable-remote-write-receiver
  --enable-feature=exemplar-storage
monitoring_tls_dir: /etc/monitoring/tls
monitoring_alloy_dir: /etc/alloy
monitoring_system_root_ca_path: /usr/local/share/ca-certificates/brown-rook-root-ca.crt
monitoring_grafana_secret_marker: /var/lib/grafana/.home-budget-loki-datasource.sha256
monitoring_grafana_prometheus_provisioning_path: >-
  /etc/grafana/provisioning/datasources/home-budget-prometheus.yml
monitoring_grafana_dashboard_provisioning_path: >-
  /etc/grafana/provisioning/dashboards/home-budget.yml
monitoring_grafana_dashboard_dir: /var/lib/grafana/dashboards/home-budget
monitoring_grafana_dashboard_path: >-
  /var/lib/grafana/dashboards/home-budget/receipt-telemetry.json
monitoring_grafana_ocr_dashboard_path: >-
  /var/lib/grafana/dashboards/home-budget/ocr-performance.json
monitoring_grafana_public_demo_dashboard_path: >-
  /var/lib/grafana/dashboards/home-budget/public-live-demo.json
monitoring_grafana_systemd_override_dir: >-
  /etc/systemd/system/grafana-server.service.d
monitoring_grafana_public_demo_enabled: true
monitoring_grafana_public_demo_annotations_enabled: false
monitoring_grafana_public_demo_time_selection_enabled: false

# Bound local service-log churn independently of Loki's application log level.
monitoring_journal_system_max_use: 256M
monitoring_journal_system_keep_free: 1G
monitoring_journal_system_max_file_size: 32M
monitoring_journal_runtime_max_use: 64M
monitoring_journal_max_retention: 7day
monitoring_journal_rate_limit_interval: 30s
monitoring_journal_rate_limit_burst: 5000
