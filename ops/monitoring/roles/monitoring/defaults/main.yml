---
monitoring_repo_root: "{{ playbook_dir | dirname | dirname }}"

# Secret inputs are resolved on the controller and are never copied into Git.
monitoring_pki_dir: "{{ lookup('ansible.builtin.env', 'MONITORING_PKI_DIR') }}"
monitoring_alloy_kubeconfig: >-
  {{ lookup('ansible.builtin.env', 'MONITORING_ALLOY_KUBECONFIG') }}
monitoring_admin_kubeconfig: >-
  {{ lookup('ansible.builtin.env', 'MONITORING_ADMIN_KUBECONFIG') }}
monitoring_grafana_admin_user: >-
  {{ lookup('ansible.builtin.env', 'MONITORING_GRAFANA_ADMIN_USER') | default('admin', true) }}
monitoring_grafana_admin_password: >-
  {{ lookup('ansible.builtin.env', 'MONITORING_GRAFANA_ADMIN_PASSWORD') }}

monitoring_root_ca_source: "{{ monitoring_pki_dir }}/root/root_ca.crt"
monitoring_intermediate_ca_source: "{{ monitoring_pki_dir }}/intermediate/intermediate_ca.crt"
monitoring_server_cert_source: "{{ monitoring_pki_dir }}/leafs/monitoring/monitoring.fullchain.crt"
monitoring_server_key_source: "{{ monitoring_pki_dir }}/leafs/monitoring/monitoring.key"
monitoring_alloy_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/alloy-loki-client/alloy-loki-client.fullchain.crt
monitoring_alloy_key_source: >-
  {{ monitoring_pki_dir }}/leafs/alloy-loki-client/alloy-loki-client.key
monitoring_grafana_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/grafana-loki-client/grafana-loki-client.fullchain.crt
monitoring_grafana_key_source: >-
  {{ monitoring_pki_dir }}/leafs/grafana-loki-client/grafana-loki-client.key
monitoring_fluent_bit_cert_source: >-
  {{ monitoring_pki_dir }}/leafs/fluent-bit-loki-client/fluent-bit-loki-client.fullchain.crt
monitoring_fluent_bit_key_source: >-
  {{ monitoring_pki_dir }}/leafs/fluent-bit-loki-client/fluent-bit-loki-client.key

monitoring_loki_config_path: /etc/loki/config.yml
monitoring_loki_log_level: info
monitoring_tls_dir: /etc/monitoring/tls
monitoring_alloy_dir: /etc/alloy
monitoring_system_root_ca_path: /usr/local/share/ca-certificates/brown-rook-root-ca.crt
monitoring_grafana_secret_marker: /var/lib/grafana/.home-budget-loki-datasource.sha256

# Bound local service-log churn independently of Loki's application log level.
monitoring_journal_system_max_use: 256M
monitoring_journal_system_keep_free: 1G
monitoring_journal_system_max_file_size: 32M
monitoring_journal_runtime_max_use: 64M
monitoring_journal_max_retention: 7day
monitoring_journal_rate_limit_interval: 30s
monitoring_journal_rate_limit_burst: 5000
