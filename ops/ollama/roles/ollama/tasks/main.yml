---
- name: Read host services
  ansible.builtin.service_facts:

- name: Require the existing Ollama installation
  ansible.builtin.assert:
    that:
      - "'ollama.service' in ansible_facts.services"
      - ollama_listen_address == ansible_host
      - ollama_allowed_sources | length > 0
    fail_msg: Install Ollama first and configure its private host address and allowed sources in the inventory.

- name: Create Ollama systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Manage the private Ollama listener
  ansible.builtin.template:
    src: listen.conf.j2
    dest: /etc/systemd/system/ollama.service.d/listen.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Ollama

- name: Verify the system Python for the read only GPU telemetry endpoint
  # These managed hosts already use Python for Ansible. Avoid a needless DNF
  # transaction: the NVIDIA plugin writes to stdout and corrupts module JSON.
  ansible.builtin.command:
    argv: [/usr/bin/python3, --version]
  changed_when: false
  check_mode: false

- name: Read the existing Ollama service account
  ansible.builtin.command:
    argv: [systemctl, show, ollama, --property=User, --value]
  register: ollama_service_user
  changed_when: false
  check_mode: false

- name: Create the host helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the NVIDIA utilization reader
  ansible.builtin.copy:
    src: gpu_telemetry.py
    dest: /usr/local/libexec/ollama-gpu-telemetry.py
    owner: root
    group: root
    mode: "0644"
  notify: Restart Ollama GPU telemetry

- name: Manage the private GPU telemetry service
  ansible.builtin.template:
    src: gpu-telemetry.service.j2
    dest: /etc/systemd/system/ollama-gpu-telemetry.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Ollama GPU telemetry

- name: Configure source restricted access when firewalld is running
  when: (ansible_facts.services.get('firewalld.service', {})).get('state', '') == 'running'
  block:
    - name: Read the default firewall zone
      ansible.builtin.command:
        argv: [firewall-cmd, --get-default-zone]
      register: ollama_default_zone
      changed_when: false
      check_mode: false

    - name: Define Ollama firewall rules
      ansible.builtin.set_fact:
        ollama_effective_zone: "{{ ollama_firewall_zone | default('', true) or ollama_default_zone.stdout }}"
        ollama_firewall_rules: []

    - name: Build rules for the approved private networks
      ansible.builtin.set_fact:
        ollama_firewall_rules: >-
          {{ ollama_firewall_rules + ['rule family="ipv4" source address="' + item.0
             + '" port port="' + (item.1 | string) + '" protocol="tcp" accept'] }}
      loop: "{{ query('nested', ollama_allowed_sources, [ollama_port, ollama_gpu_telemetry_port]) }}"

    - name: Check persistent Ollama firewall rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--zone={{ ollama_effective_zone }}"
          - --permanent
          - "--query-rich-rule={{ item }}"
      loop: "{{ ollama_firewall_rules }}"
      register: ollama_persistent_rules
      changed_when: false
      failed_when: ollama_persistent_rules.rc not in [0, 1]
      check_mode: false

    - name: Add missing persistent Ollama firewall rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--zone={{ ollama_effective_zone }}"
          - --permanent
          - "--add-rich-rule={{ item.item }}"
      loop: "{{ ollama_persistent_rules.results }}"
      when: item.rc == 1
      changed_when: true

    - name: Check active Ollama firewall rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--zone={{ ollama_effective_zone }}"
          - "--query-rich-rule={{ item }}"
      loop: "{{ ollama_firewall_rules }}"
      register: ollama_active_rules
      changed_when: false
      failed_when: ollama_active_rules.rc not in [0, 1]
      check_mode: false

    - name: Add missing active Ollama firewall rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--zone={{ ollama_effective_zone }}"
          - "--add-rich-rule={{ item.item }}"
      loop: "{{ ollama_active_rules.results }}"
      when: item.rc == 1
      changed_when: true

    - name: Report missing firewall rules in check mode
      ansible.builtin.debug:
        msg: "Would add Ollama access in {{ ollama_effective_zone }}: {{ item.item }}"
      loop: "{{ ollama_persistent_rules.results + ollama_active_rules.results }}"
      when:
        - ansible_check_mode
        - item.rc == 1
      changed_when: true

- name: Apply listener changes before verifying the API
  ansible.builtin.meta: flush_handlers

- name: Ensure Ollama is enabled and running
  ansible.builtin.systemd_service:
    name: ollama
    enabled: true
    state: started

- name: Ensure GPU telemetry is enabled and running
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: ollama-gpu-telemetry
    daemon_reload: true
    enabled: true
    state: started

- name: Verify the private GPU telemetry endpoint
  ansible.builtin.uri:
    url: "http://{{ ollama_listen_address }}:{{ ollama_gpu_telemetry_port }}/gpu"
    return_content: true
    use_proxy: false
    status_code: 200
  register: ollama_gpu_api
  retries: 5
  delay: 2
  until: ollama_gpu_api.status == 200
  when: not ansible_check_mode

- name: Confirm the host GPU is visible to the service account
  ansible.builtin.assert:
    that:
      - ollama_gpu_api.json.gpus | length > 0
    quiet: true
  when: not ansible_check_mode

- name: Verify the Ollama API on its private address
  ansible.builtin.uri:
    url: "http://{{ ollama_listen_address }}:{{ ollama_port }}/api/tags"
    return_content: true
    use_proxy: false
    status_code: 200
  register: ollama_api
  retries: 10
  delay: 2
  until: ollama_api.status == 200
  when: not ansible_check_mode

- name: Confirm Ollama returned its model inventory
  ansible.builtin.assert:
    that:
      - ollama_api.json.models is defined
    quiet: true
  when: not ansible_check_mode
