---
- name: Read host services
  ansible.builtin.service_facts:

- name: Validate shared Ollama configuration
  ansible.builtin.assert:
    that:
      - ollama_listen_address == ansible_host
      - ollama_allowed_sources | length > 0
    fail_msg: Configure the private host address and allowed networks.

- name: Verify the system Python for the read only GPU telemetry endpoint
  # These managed hosts already use Python for Ansible. Avoid a needless DNF
  # transaction: the NVIDIA plugin writes to stdout and corrupts module JSON.
  ansible.builtin.command:
    argv: [/usr/bin/python3, --version]
  changed_when: false
  check_mode: false

- name: Set the Ollama service account
  ansible.builtin.set_fact:
    ollama_service_user:
      stdout: ollama

- name: Configure shared GPU inference and private access
  ansible.builtin.import_tasks: split.yml

- name: Create the host helper directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the NVIDIA utilization reader
  ansible.builtin.copy:
    src: gpu_telemetry.py
    dest: /usr/local/libexec/ollama-gpu-telemetry.py
    owner: root
    group: root
    mode: "0644"
  notify: Restart Ollama GPU telemetry

- name: Manage the private GPU telemetry service
  ansible.builtin.template:
    src: gpu-telemetry.service.j2
    dest: /etc/systemd/system/ollama-gpu-telemetry.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Ollama GPU telemetry

- name: Configure native Ollama journal forwarding
  ansible.builtin.import_tasks: monitoring.yml
  when: ollama_monitoring_enabled | bool

- name: Configure source restricted access when firewalld is running
  when: (ansible_facts.services.get('firewalld.service', {})).get('state', '') == 'running'
  block:
    - name: Read the default firewall zone
      ansible.builtin.command:
        argv: [firewall-cmd, --get-default-zone]
      register: ollama_default_zone
      changed_when: false
      check_mode: false

    - name: Define Ollama firewall rules
      ansible.builtin.set_fact:
        ollama_effective_zone: "{{ ollama_firewall_zone | default('', true) or ollama_default_zone.stdout }}"
        ollama_firewall_rules: []

    - name: Build rules for the approved private networks
      ansible.builtin.set_fact:
        ollama_firewall_rules: >-
          {{ ollama_firewall_rules + ['rule family="ipv4" source address="' + item.0
             + '" port port="' + (item.1 | string) + '" protocol="tcp" accept'] }}
      loop: "{{ query('nested', ollama_allowed_sources, [ollama_port, ollama_gpu_telemetry_port]) }}"

    - name: Check persistent Ollama firewall rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--zone={{ ollama_effective_zone }}"
          - --permanent
          - "--query-rich-rule={{ item }}"
      loop: "{{ ollama_firewall_rules }}"
      register: ollama_persistent_rules
      changed_when: false
      failed_when: ollama_persistent_rules.rc not in [0, 1]
      check_mode: false

    - name: Add missing persistent Ollama firewall rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--zone={{ ollama_effective_zone }}"
          - --permanent
          - "--add-rich-rule={{ item.item }}"
      loop: "{{ ollama_persistent_rules.results }}"
      when: item.rc == 1
      changed_when: true

    - name: Check active Ollama firewall rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--zone={{ ollama_effective_zone }}"
          - "--query-rich-rule={{ item }}"
      loop: "{{ ollama_firewall_rules }}"
      register: ollama_active_rules
      changed_when: false
      failed_when: ollama_active_rules.rc not in [0, 1]
      check_mode: false

    - name: Add missing active Ollama firewall rules
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - "--zone={{ ollama_effective_zone }}"
          - "--add-rich-rule={{ item.item }}"
      loop: "{{ ollama_active_rules.results }}"
      when: item.rc == 1
      changed_when: true

    - name: Report missing firewall rules in check mode
      ansible.builtin.debug:
        msg: "Would add Ollama access in {{ ollama_effective_zone }}: {{ item.item }}"
      loop: "{{ ollama_persistent_rules.results + ollama_active_rules.results }}"
      when:
        - ansible_check_mode
        - item.rc == 1
      changed_when: true

- name: Apply listener changes before verifying the API
  ansible.builtin.meta: flush_handlers

- name: Ensure Ollama is enabled and running
  ansible.builtin.systemd_service:
    name: ollama
    enabled: true
    state: started

- name: Ensure GPU telemetry is enabled and running
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: ollama-gpu-telemetry
    daemon_reload: true
    enabled: true
    state: started

- name: Verify the private GPU telemetry endpoint
  ansible.builtin.uri:
    url: "http://{{ ollama_listen_address }}:{{ ollama_gpu_telemetry_port }}/gpu"
    return_content: true
    use_proxy: false
    status_code: 200
  register: ollama_gpu_api
  retries: 5
  delay: 2
  until: ollama_gpu_api.status == 200
  when: not ansible_check_mode

- name: Confirm the host GPU is visible to the service account
  ansible.builtin.assert:
    that:
      - ollama_gpu_api.json.gpus | length > 0
    quiet: true
  when: not ansible_check_mode

- name: Verify continuous service metrics on the private helper
  ansible.builtin.uri:
    url: "http://{{ ollama_listen_address }}:{{ ollama_gpu_telemetry_port }}/metrics"
    return_content: true
    use_proxy: false
    status_code: 200
  register: ollama_metrics_api
  when: not ansible_check_mode

- name: Confirm host service and GPU accounting are readable
  ansible.builtin.assert:
    that:
      - "'ollama_service_collector_success 1' in ollama_metrics_api.content"
      - "'ollama_host_collector_success 1' in ollama_metrics_api.content"
      - "'ollama_gpu_collector_success 1' in ollama_metrics_api.content"
      - "'ollama_api_up 1' in ollama_metrics_api.content"
    quiet: true
  when: not ansible_check_mode

- name: Verify the Ollama API on its private address
  ansible.builtin.uri:
    url: "http://{{ ollama_listen_address }}:{{ ollama_port }}/api/tags"
    return_content: true
    use_proxy: false
    status_code: 200
  register: ollama_api
  retries: 10
  delay: 2
  until: ollama_api.status == 200
  when: not ansible_check_mode

- name: Confirm Ollama returned its model inventory
  ansible.builtin.assert:
    that:
      - ollama_api.json.models is defined
    quiet: true
  when: not ansible_check_mode

- name: Read the managed receipt model specification
  ansible.builtin.set_fact:
    ollama_receipt_model_spec: "{{ lookup('ansible.builtin.file', role_path + '/files/receipt-model.json') | from_json }}"

- name: Read the installed receipt model template
  ansible.builtin.uri:
    url: "http://{{ ollama_listen_address }}:{{ ollama_port }}/api/show"
    method: POST
    body_format: json
    body:
      model: "{{ ollama_receipt_model_spec.model }}"
    return_content: true
    use_proxy: false
    status_code: [200, 404]
  register: ollama_receipt_model_current
  check_mode: false

- name: Determine whether the receipt model needs reconciliation
  ansible.builtin.set_fact:
    ollama_receipt_model_changed: >-
      {{ ollama_receipt_model_current.status == 404
         or ollama_receipt_model_current.json.template != ollama_receipt_model_spec.template
         or ((ollama_receipt_model_current.json.parameters | regex_replace('[ \t]+', ' ')).splitlines() | sort)
            != (['temperature 0.7', 'top_k 20', 'top_p 0.8', 'stop "<|im_start|>"', 'stop "<|im_end|>"'] | sort) }}

- name: Create the receipt model with its chat template
  ansible.builtin.uri:
    url: "http://{{ ollama_listen_address }}:{{ ollama_port }}/api/create"
    method: POST
    body_format: json
    body: "{{ lookup('ansible.builtin.file', role_path + '/files/receipt-model.json') }}"
    return_content: true
    use_proxy: false
    status_code: 200
    timeout: 120
  when:
    - not ansible_check_mode
    - ollama_receipt_model_changed
  changed_when: true

- name: Report the receipt model reconciliation in check mode
  ansible.builtin.debug:
    msg: "Would create {{ ollama_receipt_model_spec.model }} from the installed {{ ollama_receipt_model_spec.from }} weights with the managed chat template."
  when:
    - ansible_check_mode
    - ollama_receipt_model_changed
  changed_when: true

- name: Verify default local Ollama API
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/tags
    use_proxy: false
    status_code: 200
  when: not ansible_check_mode
