---
- name: Restart Ollama
  ansible.builtin.systemd_service:
    name: ollama
    daemon_reload: true
    state: restarted

- name: Restart Ollama GPU telemetry
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: ollama-gpu-telemetry
    daemon_reload: true
    state: restarted

- name: Restart Ollama Alloy
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: alloy
    daemon_reload: true
    state: restarted

- name: Restart Ollama access
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: ollama-access
    daemon_reload: true
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
