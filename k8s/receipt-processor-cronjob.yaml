apiVersion: batch/v1
kind: CronJob
metadata:
  name: receipt-processor
  namespace: home-budget
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: receipt-processor
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: receipt-processor
              image: ghcr.io/larocquemb/home-budget-pipeline:latest
              imagePullPolicy: IfNotPresent
              command:
                - home-budget-process-receipts
              args:
                - /data/receipts/raw/scanned/inbox
                - --workers
                - "2"
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ledger-db-secret
                      key: DATABASE_URL
                - name: RECEIPT_SOURCE_ROOT
                  value: /data/receipts/raw/scanned/inbox
                - name: HOME_BUDGET_OCR_CACHE
                  value: /data/receipts/derived/ocr-cache
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              volumeMounts:
                - name: receipt-data
                  mountPath: /data
          volumes:
            - name: receipt-data
              persistentVolumeClaim:
                claimName: home-budget-data
