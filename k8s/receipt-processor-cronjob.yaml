apiVersion: batch/v1
kind: CronJob
metadata:
  name: receipt-processor
  namespace: home-budget
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: receipt-processor
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: receipt-processor
              image: ghcr.io/larocquemb/home-budget-pipeline:latest
              imagePullPolicy: IfNotPresent
              command:
                - ledger
              args:
                - receipts
                - publish
                - /data/receipts/raw/scanned/inbox
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: DATABASE_URL
                - name: RABBITMQ_URL
                  valueFrom:
                    secretKeyRef:
                      name: rabbitmq-secret
                      key: RABBITMQ_URL
                - name: RECEIPT_SOURCE_ROOT
                  value: /data/receipts/raw/scanned/inbox
                - name: HOME_BUDGET_OCR_CACHE
                  valueFrom:
                    configMapKeyRef:
                      name: receipt-runtime-config
                      key: HOME_BUDGET_OCR_CACHE
                - name: HOME_BUDGET_PADDLE_OCR
                  value: "true"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: receipt-data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: receipt-data
              persistentVolumeClaim:
                claimName: home-budget-data
