# Enable only after make k3s-postgres-grafana-apply has installed the TLS Secret.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: home-budget
spec:
  template:
    spec:
      containers:
        - name: postgres
          args:
            - -c
            - oauth_validator_libraries=pg_oidc_validator
            - -c
            - pg_oidc_validator.authn_field=oid
            - -c
            - pg_oidc_validator.audience=$(POSTGRES_OAUTH_AUDIENCE)
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-reporting-tls/server.crt
            - -c
            - ssl_key_file=/etc/postgres-reporting-tls/server.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
          volumeMounts:
            - name: postgres-reporting-tls
              mountPath: /etc/postgres-reporting-tls
              readOnly: true
      volumes:
        - name: postgres-reporting-tls
          secret:
            secretName: postgres-reporting-tls
            # Root-owned 0640 keys are accepted by PostgreSQL with group access.
            defaultMode: 0640
      securityContext:
        fsGroup: 999
