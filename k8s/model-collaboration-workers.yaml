# Independent provider consumers; inference remains on Arsene for Qwen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-worker-qwen
  namespace: home-budget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-worker
      provider: qwen
  template:
    metadata:
      labels:
        app: model-worker
        provider: qwen
    spec:
      terminationGracePeriodSeconds: 900
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: model-worker
        image: ghcr.io/larocquemb/home-budget-pipeline
        imagePullPolicy: IfNotPresent
        command:
        - home-budget-model-worker
        args:
        - --provider
        - qwen
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOME_BUDGET_RECEIPTS_ROOT
          value: /data/receipts/raw/scanned/inbox
        - name: HOME_BUDGET_OCR_CACHE
          valueFrom:
            configMapKeyRef:
              name: receipt-runtime-config
              key: HOME_BUDGET_OCR_CACHE
        - name: OCR_ARTIFACT_URI_PREFIX
          value: pvc://home-budget/receipts/derived/ocr-cache
        # Measured CPU optimum on Arsene; development GPU clients keep defaults.
        - name: OLLAMA_NUM_THREADS
          value: "5"
        # Cold CPU receipt-image request measured 193s; cloud waits stay at 180s.
        - name: OLLAMA_TIMEOUT_SECONDS
          value: "300"
        - name: OLLAMA_BASE_URL
          value: http://192.168.2.201:11434
        - name: OLLAMA_GPU_METRICS_URL
          value: http://192.168.2.201:11435/gpu
        - name: GPU_SAMPLE_INTERVAL_SECONDS
          value: '1'
        - name: OLLAMA_CONTEXT_TOKENS
          value: '4096'
        - name: OLLAMA_PRODUCT_MODEL
          value: qwen3.8:27b
        - name: COMPARISON_TIMEOUT_SECONDS
          value: '180'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DATABASE_URL
        - name: BRAVE_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: brave-search-api
              key: BRAVE_SEARCH_API_KEY
              optional: true
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: RABBITMQ_URL
        - name: COLLABORATION_TRANSPORT
          value: rabbitmq
        envFrom:
        - configMapRef:
            name: receipt-model-profiles
            optional: true
        volumeMounts:
        - name: receipt-data
          mountPath: /data
          readOnly: true
      volumes:
      - name: receipt-data
        persistentVolumeClaim:
          claimName: home-budget-data
---
