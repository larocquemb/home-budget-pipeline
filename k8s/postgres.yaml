apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: home-budget
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: home-budget
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: stage-db-bootstrap
          # Keep bootstrap separate from the Kustomize-managed app image so
          # app-only releases do not restart PostgreSQL.
          image: ghcr.io/larocquemb/home-budget-schema-bootstrap:main
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              /opt/app-root/src/scripts/stage_db_bootstrap.sh /schema
          volumeMounts:
            - name: postgres-init
              mountPath: /schema
      containers:
        - name: postgres
          image: ghcr.io/larocquemb/home-budget-postgres:18.6-oidc-7b6565afbc56bc8abcb75939d28c898377a10f00
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - oauth_validator_libraries=pg_oidc_validator
            - -c
            - pg_oidc_validator.authn_field=oid
            - -c
            - pg_oidc_validator.audience=$(POSTGRES_OAUTH_AUDIENCE)
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: POSTGRES_OAUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: ledger-oauth2-proxy-secret
                  key: OAUTH2_PROXY_CLIENT_ID
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # PostgreSQL 18 stores versioned data below this parent directory.
            # Use a fresh claim instead of attaching the PostgreSQL 17 volume.
            - name: postgres18-data
              mountPath: /var/lib/postgresql
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: postgres-init
          emptyDir: {}
        - name: postgres18-data
          persistentVolumeClaim:
            claimName: postgres18-data
  # Keep the legacy claim template in place because this field is immutable on
  # the live StatefulSet. It is intentionally not mounted by the PostgreSQL 18
  # pod, preserving postgres-data-postgres-0 as a PostgreSQL 17 rollback copy.
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres18-data
  namespace: home-budget
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
