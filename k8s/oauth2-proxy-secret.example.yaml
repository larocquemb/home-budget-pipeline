apiVersion: v1
kind: Secret
metadata:
  name: ledger-oauth2-proxy-secret
  namespace: home-budget
type: Opaque
stringData:
  ENTRA_TENANT_ID: REPLACE_WITH_ENTRA_TENANT_ID
  OAUTH2_PROXY_CLIENT_ID: REPLACE_WITH_ENTRA_APP_CLIENT_ID
  OAUTH2_PROXY_CLIENT_SECRET: REPLACE_WITH_ENTRA_APP_CLIENT_SECRET
  # Generate with: openssl rand -base64 32 | tr -- '+/' '-_'
  OAUTH2_PROXY_COOKIE_SECRET: REPLACE_WITH_32_BYTE_BASE64URL_SECRET
