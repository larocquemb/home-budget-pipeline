apiVersion: batch/v1
kind: Job
metadata:
  name: receipt-processing-schema-upgrade
  namespace: home-budget
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: receipt-processing-schema-upgrade
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: upgrade-receipt-schema
          image: ghcr.io/larocquemb/home-budget-pipeline
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - home_budget_pipeline.receipts.schema_blue_green
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
