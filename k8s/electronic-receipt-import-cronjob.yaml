apiVersion: batch/v1
kind: CronJob
metadata:
  name: electronic-receipt-import
  namespace: home-budget
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: electronic-receipt-import
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: importer
              image: ghcr.io/larocquemb/home-budget-pipeline
              command: [home-budget-import-electronic]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: DATABASE_URL
                - name: ENABLE_AI_CATEGORY_FALLBACK
                  value: "0"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: receipt-data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: receipt-data
              persistentVolumeClaim:
                claimName: home-budget-data
