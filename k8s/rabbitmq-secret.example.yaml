apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: home-budget
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: receipts
  RABBITMQ_DEFAULT_PASS: REPLACE_ME
  # Use the same password, URL-encoded, in the connection URL.
  RABBITMQ_URL: amqp://receipts:REPLACE_ME@rabbitmq:5672/receipts
