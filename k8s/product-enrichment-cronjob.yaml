apiVersion: batch/v1
kind: CronJob
metadata:
  name: product-enrichment
  namespace: home-budget
spec:
  # This CronJob is a GitOps-managed template for on-demand enrichment jobs.
  # Keep it suspended until a recurring enrichment cadence is intentionally chosen.
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: enrich
              image: ghcr.io/larocquemb/home-budget-pipeline
              imagePullPolicy: IfNotPresent
              command:
                - home-budget-enrich-products
              args:
                - --limit
                - "100"
                - --threshold
                - "0.85"
                - --write-db
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: OLLAMA_BASE_URL
                  value: http://192.168.2.201:11434
                - name: OLLAMA_GPU_METRICS_URL
                  value: http://192.168.2.201:11435/gpu
                - name: GPU_SAMPLE_INTERVAL_SECONDS
                  value: "1"
                - name: OLLAMA_CONTEXT_TOKENS
                  value: "4096"
                - name: OLLAMA_PRODUCT_MODEL
                  value: qwen3:30b
                - name: COMPARISON_TIMEOUT_SECONDS
                  value: "180"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: DATABASE_URL
                - name: BRAVE_SEARCH_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: brave-search-api
                      key: BRAVE_SEARCH_API_KEY
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: openai-api
                      key: OPENAI_API_KEY
