apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: home-budget
type: Opaque
stringData:
  POSTGRES_DB: home_budget
  POSTGRES_USER: home_budget
  POSTGRES_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
  DATABASE_URL: postgresql://home_budget:REPLACE_WITH_URL_ENCODED_PASSWORD@postgres.home-budget.svc.cluster.local:5432/home_budget
