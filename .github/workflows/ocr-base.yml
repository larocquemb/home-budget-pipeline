name: OCR Base Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile.ocr-base
      - .github/workflows/ocr-base.yml

concurrency:
  group: ocr-base-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture OCR base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ocr-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/larocquemb/home-budget-ocr-base:rhel9.6
            ghcr.io/larocquemb/home-budget-ocr-base:rhel9.6-tesseract5.5.2
          labels: |
            org.opencontainers.image.source=https://github.com/larocquemb/home-budget-pipeline
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ocr-base
          cache-to: type=gha,mode=max,scope=ocr-base
