name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -v -m "not integration"

  postgres-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: home_budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d home_budget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,db]"

      - name: Load PostgreSQL test schema
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d home_budget \
            -v ON_ERROR_STOP=1 \
            -f sql/schema_phase1.sql
          psql -h localhost -U test -d home_budget \
            -v ON_ERROR_STOP=1 \
            -f sql/receipt_processing.sql
          psql -h localhost -U test -d home_budget \
            -v ON_ERROR_STOP=1 \
            -f sql/schema_constraints.sql

      - name: Run PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/home_budget
        run: python -m pytest -v -m integration

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - postgres-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/larocquemb/home-budget-pipeline:${{ github.sha }}
            ghcr.io/larocquemb/home-budget-pipeline:main
          labels: |
            org.opencontainers.image.source=https://github.com/larocquemb/home-budget-pipeline
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point Kustomize at immutable image
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("k8s/kustomization.yaml")
          text = path.read_text()
          image_sha = os.environ["IMAGE_SHA"]
          updated, count = re.subn(
              r"(name:\s*ghcr\.io/larocquemb/home-budget-pipeline\s*\n\s*newTag:\s*)\S+",
              rf"\g<1>{image_sha}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update home-budget-pipeline newTag in k8s/kustomization.yaml")
          path.write_text(updated)
          PY

      - name: Commit deployment image pointer
        run: |
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "Deployment already points at ${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "Deploy ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
