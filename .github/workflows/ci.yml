name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,db]"

      - name: Run unit tests
        run: python -m pytest -v -m "not integration"

      - name: Validate external Alloy configuration
        run: |
          mkdir -p "$RUNNER_TEMP/alloy"
          cp deploy/external-logging/config.alloy "$RUNNER_TEMP/alloy/config.alloy"
          cp deploy/local-logging/config.local.alloy "$RUNNER_TEMP/alloy/config.local.alloy"
          cp /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/alloy/brown-rook-root-ca.crt"
          cp /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/alloy/ca.crt"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=alloy-validation' \
            -keyout "$RUNNER_TEMP/alloy/loki-client.key" \
            -out "$RUNNER_TEMP/alloy/loki-client.crt"
          cat > "$RUNNER_TEMP/alloy/home-budget.kubeconfig" <<'EOF'
          apiVersion: v1
          kind: Config
          clusters:
            - name: validation
              cluster:
                insecure-skip-tls-verify: true
                server: https://kubernetes.invalid
          users:
            - name: validation
              user:
                token: validation-only
          contexts:
            - name: validation
              context:
                cluster: validation
                namespace: home-budget
                user: validation
          current-context: validation
          EOF
          docker run --rm \
            --mount type=bind,source="$RUNNER_TEMP/alloy",target=/etc/alloy,readonly \
            grafana/alloy:v1.19.0 \
            validate /etc/alloy/config.alloy
          docker run --rm \
            --mount type=bind,source="$RUNNER_TEMP/alloy",target=/etc/alloy,readonly \
            grafana/alloy:v1.19.0 \
            validate /etc/alloy/config.local.alloy

      - name: Validate Fluent Bit configuration
        run: |
          mkdir -p "$RUNNER_TEMP/fluent-bit/tls" "$RUNNER_TEMP/fluent-bit/buffers"
          python - "$RUNNER_TEMP/fluent-bit" <<'PY'
          import pathlib
          import sys
          import yaml

          output = pathlib.Path(sys.argv[1])
          resources = yaml.safe_load_all(
              pathlib.Path("deploy/fluent-bit/fluent-bit.yaml").read_text()
          )
          config = next(
              item for item in resources
              if item["kind"] == "ConfigMap"
              and item["metadata"]["name"] == "fluent-bit-config"
          )["data"]
          (output / "fluent-bit.conf").write_text(config["fluent-bit.conf"])
          (output / "filters.lua").write_text(config["filters.lua"])
          PY
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=fluent-bit-validation' \
            -keyout "$RUNNER_TEMP/fluent-bit/tls/tls.key" \
            -out "$RUNNER_TEMP/fluent-bit/tls/tls.crt"
          cp "$RUNNER_TEMP/fluent-bit/tls/tls.crt" \
            "$RUNNER_TEMP/fluent-bit/tls/ca.crt"
          docker run --rm \
            --env LOKI_HOST=monitoring.invalid \
            --env LOKI_PORT=3100 \
            --env LOKI_TLS_VHOST=monitoring.invalid \
            --env LOKI_CLUSTER=validation \
            --env LOKI_ENVIRONMENT=ci \
            --env FLUENT_BIT_LOG_LEVEL=info \
            --mount type=bind,source="$RUNNER_TEMP/fluent-bit/fluent-bit.conf",target=/fluent-bit/etc/fluent-bit.conf,readonly \
            --mount type=bind,source="$RUNNER_TEMP/fluent-bit/filters.lua",target=/fluent-bit/etc/filters.lua,readonly \
            --mount type=bind,source="$RUNNER_TEMP/fluent-bit/tls",target=/fluent-bit/tls,readonly \
            --mount type=bind,source="$RUNNER_TEMP/fluent-bit/buffers",target=/buffers \
            cr.fluentbit.io/fluent/fluent-bit:4.2.0 \
            --dry-run -c /fluent-bit/etc/fluent-bit.conf

  postgres-integration:
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: home_budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d home_budget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,db]"

      - name: Load PostgreSQL test schema
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d home_budget \
            -v ON_ERROR_STOP=1 \
            -f sql/schema_phase1.sql
          psql -h localhost -U test -d home_budget \
            -v ON_ERROR_STOP=1 \
            -f sql/receipt_processing.sql
          psql -h localhost -U test -d home_budget \
            -v ON_ERROR_STOP=1 \
            -f sql/schema_constraints.sql
          psql -h localhost -U test -d home_budget \
            -v ON_ERROR_STOP=1 \
            -f sql/product_enrichment.sql
          psql -h localhost -U test -d home_budget \
            -v ON_ERROR_STOP=1 \
            -f sql/receipt_reprocess_requests.sql

      - name: Run PostgreSQL and RabbitMQ integration tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/home_budget
          TEST_RABBITMQ_URL: amqp://test:test@localhost:5672/%2F
        run: python -m pytest -v -m integration

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - postgres-integration
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/larocquemb/home-budget-pipeline:${{ github.sha }}
            ghcr.io/larocquemb/home-budget-pipeline:main
            ghcr.io/larocquemb/home-budget-schema-bootstrap:main
          labels: |
            org.opencontainers.image.source=https://github.com/larocquemb/home-budget-pipeline
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point Kustomize at immutable image
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("k8s/kustomization.yaml")
          text = path.read_text()
          image_sha = os.environ["IMAGE_SHA"]
          updated, count = re.subn(
              r"(name:\s*ghcr\.io/larocquemb/home-budget-pipeline\s*\n\s*newTag:\s*)\S+",
              rf"\g<1>{image_sha}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update home-budget-pipeline newTag in k8s/kustomization.yaml")
          path.write_text(updated)
          PY

      - name: Commit deployment image pointer
        run: |
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "Deployment already points at ${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "Deploy ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
