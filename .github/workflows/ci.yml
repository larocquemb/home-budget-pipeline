name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'KAN-*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/larocquemb/home-budget-pipeline:${{ github.sha }}
            ghcr.io/larocquemb/home-budget-pipeline:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/larocquemb/home-budget-pipeline
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point Kustomize at immutable image
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("k8s/kustomization.yaml")
          text = path.read_text()
          image_sha = os.environ["IMAGE_SHA"]
          updated, count = re.subn(
              r"(name:\s*ghcr\.io/larocquemb/home-budget-pipeline\s*\n\s*newTag:\s*)\S+",
              rf"\g<1>{image_sha}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update home-budget-pipeline newTag in k8s/kustomization.yaml")
          path.write_text(updated)
          PY

      - name: Commit deployment image pointer
        run: |
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "Deployment already points at ${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "Deploy ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
