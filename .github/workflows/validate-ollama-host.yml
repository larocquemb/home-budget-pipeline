name: Validate native Ollama configuration
on:
  pull_request:
    paths: ["ops/ollama/**", "scripts/render_ollama_host.py", ".github/workflows/validate-ollama-host.yml"]
  push:
    branches: [main]
    paths: ["ops/ollama/**", "scripts/render_ollama_host.py", ".github/workflows/validate-ollama-host.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install jinja2 PyYAML
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - run: python scripts/render_ollama_host.py /tmp/ollama-rendered
      - run: sudo nft --check --file /tmp/ollama-rendered/ollama-access.nft
      - run: systemd-analyze verify /tmp/ollama-rendered/ollama.service /tmp/ollama-rendered/ollama-access.service
