name: PostgreSQL 18 OAuth image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker/postgres-oidc/**
      - scripts/test_postgres_oidc_image.sh
      - .github/workflows/postgres-oidc-image.yml
  push:
    branches:
      - main
    paths:
      - docker/postgres-oidc/**
      - scripts/test_postgres_oidc_image.sh
      - .github/workflows/postgres-oidc-image.yml

concurrency:
  group: postgres-oidc-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PostgreSQL 18 OAuth image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/postgres-oidc/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/larocquemb/home-budget-postgres:18.6-oidc
            ghcr.io/larocquemb/home-budget-postgres:18.6-oidc-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/larocquemb/home-budget-pipeline
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
