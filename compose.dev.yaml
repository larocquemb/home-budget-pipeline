services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres-oidc/Dockerfile
    image: home-budget-postgres:18.6-oidc-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      # local_development_up.py derives these values from the generated,
      # ignored runtime environment. Passing the names without values keeps
      # credentials out of this Compose file and fails PostgreSQL startup if
      # somebody bypasses `make dev-up` without exporting them.
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    command:
      - -c
      - oauth_validator_libraries=pg_oidc_validator
      - -c
      - pg_oidc_validator.authn_field=oid
      - -c
      - pg_oidc_validator.audience=${POSTGRES_OAUTH_AUDIENCE:-local-development}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      # PostgreSQL 18 changed the image's declared data layout. Mount the
      # parent directory and use a new volume that cannot contain PG17 data.
      - home-budget-postgres18-data:/var/lib/postgresql
      - ./.local-postgres/init:/docker-entrypoint-initdb.d:ro

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    environment:
      LEDGER_PROXY_SECRET: ${LEDGER_PROXY_SECRET:?Set LEDGER_PROXY_SECRET in .env.dev}
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - ledger-caddy-data:/data
      - ledger-caddy-config:/config
    depends_on:
      - oauth2-proxy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
      OAUTH2_PROXY_CLIENT_ID: ${ENTRA_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://ledger-dev.brownrook.net/ledger/oauth2/callback
      OAUTH2_PROXY_PROXY_PREFIX: /ledger/oauth2
      OAUTH2_PROXY_UPSTREAMS: http://host.docker.internal:8080
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SCOPE: openid profile email
      OAUTH2_PROXY_COOKIE_NAME: __Secure-ledger-dev
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_PATH: /ledger
      OAUTH2_PROXY_SESSION_COOKIE_MINIMAL: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"

volumes:
  home-budget-postgres18-data:
    name: home-budget-postgres18-data
  ledger-caddy-data:
  ledger-caddy-config:
