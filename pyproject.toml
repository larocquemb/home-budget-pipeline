[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "home-budget-pipeline"
version = "0.1.0"
description = "Home budget receipt and transaction processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "Pillow>=10",
    "openpyxl>=3.1",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "PyYAML>=6.0",
    "openai>=1.68",
    "pika>=1.3.2,<2",
]

[project.scripts]
ledger = "home_budget_pipeline.cli:main"
brownrook = "home_budget_pipeline.cli:main"
home-budget-scan = "home_budget_pipeline.receipts.parallel_ingest:main"
home-budget-process-receipts = "home_budget_pipeline.receipts.backlog_ingest:main"
home-budget-receipt-queue = "home_budget_pipeline.receipts.queue_ingest:main"
home-budget-db-setup = "home_budget_pipeline.db_setup:main"
home-budget-ledger = "home_budget_pipeline.web.receipt_app:main"
home-budget-categorize = "home_budget_pipeline.categorization.command:main"
home-budget-category-catalog = "home_budget_pipeline.categorization.catalog_config:main"
home-budget-enrich-products = "home_budget_pipeline.product_enrichment_runtime:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
docs = [
    "mkdocs-material>=9.6,<10",
]
db = [
    "psycopg[binary]>=3.2",
]
paddle = [
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "scanned_receipt_ingest",
    "receipt_datetime",
    "receipt_evidence",
    "receipt_payment",
    "payment_card_lookup",
    "receipt_total_reconcile",
    "budget_category_logic",
    "budget_category_ai",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that require an external service such as PostgreSQL",
]
