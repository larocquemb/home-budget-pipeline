[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "home-budget-pipeline"
version = "0.1.0"
description = "Home budget receipt and transaction processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "Pillow>=10",
    "fastapi>=0.116",
    "uvicorn>=0.35",
]

[project.scripts]
home-budget-scan = "home_budget_pipeline.receipts.parallel_ingest:main"
home-budget-ledger = "home_budget_pipeline.web.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
db = [
    "psycopg[binary]>=3.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
# Temporary import bridges for legacy callers. Remove once all internal imports
# use the home_budget_pipeline package directly.
py-modules = [
    "scanned_receipt_ingest",
    "receipt_datetime",
    "receipt_evidence",
    "receipt_payment",
    "payment_card_lookup",
    "receipt_total_reconcile",
    "budget_category_logic",
    "budget_category_ai",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
