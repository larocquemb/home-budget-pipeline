[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "home-budget-pipeline"
version = "0.1.0"
description = "Home budget receipt and transaction processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
db = [
    "psycopg[binary]>=3.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "scanned_receipt_ingest",
    "receipt_datetime",
    "receipt_evidence",
    "receipt_payment",
    "payment_card_lookup",
    "receipt_total_reconcile",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
